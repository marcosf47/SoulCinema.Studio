<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoulCinema Studio</title><style>html,body{margin:0;background:#000;color:#f6f0df}</style></head><body><script>(async()=>{try{let h=await fetch('https://raw.githubusercontent.com/marcosf47/SoulCinema.Studio/08134c355c05aa5dde15ac4e16ba0ceb9468f209/public/index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});const css=`<style id="rc204-live-public-final">#liveCenter #stateStandby,#liveCenter #stateCountdown,#liveCenter #stateLive,#liveCenter #stateEnd,#liveCenter #stateReplay,#liveCenter #liveRouteStatus,#liveCenter #liveControls{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}#liveCenter #publicLiveBadge{display:none;margin:18px auto 0;width:max-content;min-height:38px;padding:11px 22px;border:1px solid rgba(217,183,96,.55);border-radius:999px;color:#0b0903;background:linear-gradient(180deg,#f0d57d,#d2ab4d);font:700 10px Inter,Arial,sans-serif;letter-spacing:.20em;box-shadow:0 10px 28px rgba(217,183,96,.16)}body[data-live-mode="live"] #liveCenter #publicLiveBadge{display:block!important;visibility:visible!important;opacity:1!important}body:not([data-live-mode="live"]) #liveCenter #livePlayer{display:none!important}#liveCenter #liveMain{position:relative!important;isolation:isolate!important}body:not([data-live-mode="live"]) #liveCenter #liveMain{background:radial-gradient(circle at 50% 46%,rgba(217,183,96,.12),transparent 27%),radial-gradient(circle at 50% 50%,rgba(255,238,180,.035),transparent 48%),linear-gradient(180deg,#070604 0%,#020202 58%,#000 100%)!important;box-shadow:inset 0 0 120px rgba(0,0,0,.78)}#liveCenter #liveCopy{position:relative!important;z-index:2!important;max-width:680px!important;margin:auto!important;padding:48px 28px!important;text-align:center!important}#liveCenter #liveTitle{font:400 clamp(30px,3.4vw,48px)/1.05 Georgia,serif!important;color:#f8edcf!important;letter-spacing:.025em!important;text-shadow:0 12px 42px rgba(0,0,0,.85)!important;margin:0 0 14px!important}#liveCenter #liveSubtitle{max-width:560px!important;margin:0 auto!important;color:rgba(255,248,229,.62)!important;font-size:13px!important;line-height:1.7!important}</style>`;h=h.replace('</head>',css+'</head>');h=h.replace('<div id="liveControls" style="display:flex;gap:10px;flex-wrap:wrap">','<div id="publicLiveBadge" aria-hidden="true">● ON AIR · LIVE</div><div id="liveControls" style="display:none">');const js=`<script id="rc204-live-public-runtime">(()=>{const room=document.getElementById('liveCenter'),video=document.getElementById('livePlayer'),badge=document.getElementById('liveState'),title=document.getElementById('liveTitle'),sub=document.getElementById('liveSubtitle'),pub=document.getElementById('publicLiveBadge');if(!room||!video||!badge||!title||!sub)return;const render=()=>{const m=document.body.dataset.liveMode||'standby';if(pub)pub.setAttribute('aria-hidden',m==='live'?'false':'true');if(m==='live'){badge.textContent='● ON AIR · LIVE';title.textContent='SOULCINEMA LIVE';sub.textContent='You are watching a SoulCinema live experience.';return}if(m==='ended'||m==='preparing'){badge.textContent='SOULCINEMA · OFF AIR';title.textContent='LIVE BROADCAST ENDED';sub.textContent='Thank you for watching. Stay with SoulCinema for the next live experience.';return}if(m==='replay'){badge.textContent='SOULCINEMA · REPLAY';title.textContent='SOULCINEMA REPLAY';sub.textContent='Watch the latest SoulCinema live experience.';return}badge.textContent='SOULCINEMA · OFF AIR';title.textContent='THE LIVE ROOM IS QUIET';sub.textContent='The next SoulCinema live experience will begin here.'};const probe=()=>{if(!room.classList.contains('active'))return;try{ensureLiveFeed();liveFeedArmed=true;video.muted=false;const p=video.play();if(p&&p.catch)p.catch(()=>{video.muted=true;const r=video.play();if(r&&r.catch)r.catch(()=>{})})}catch(e){}};new MutationObserver(()=>{render();probe()}).observe(room,{attributes:true,attributeFilter:['class']});new MutationObserver(render).observe(document.body,{attributes:true,attributeFilter:['data-live-mode']});video.addEventListener('playing',()=>{if(room.classList.contains('active')&&document.body.dataset.liveMode!=='live')setLiveMode('live')});video.addEventListener('ended',()=>{if(room.classList.contains('active'))setLiveMode('ended')});window.addEventListener('load',()=>{render();probe()},{once:true});render();probe()})();<\/script>`;h=h.replace('</body>',js+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;font-family:Georgia,serif;text-align:center"><div><h1>SOULCINEMA</h1><p>Loading the private cinematic experience…</p></div></main>';setTimeout(()=>location.reload(),2500)}})();</script></body></html>
