yerWrap'),copy=document.getElementById('liveCopy'),badge=document.getElementById('liveState'),title=document.getElementById('liveTitle'),sub=document.getElementById('liveSubtitle');if(!room||!video||!badge||!title||!sub)return;let probing=false,watchTimer=null,lastTime=-1,lastAdvance=0,liveSeen=false,endedLock=false,roomWasActive=false;try{sessionStorage.removeItem('soulcinema:lastBroadcastEndedAt')}catch(e){}const setMode=(m)=>{try{setLiveMode(m)}catch(e){document.body.dataset.liveMode=m}};const render=()=>{const live=document.body.dataset.liveMode==='live'&&!endedLock;if(live){badge.textContent='● ON AIR · LIVE';title.textContent='SOULCINEMA LIVE';sub.textContent='You are watching a SoulCinema live experience.';if(wrap){wrap.style.display='block';wrap.style.visibility='visible';wrap.style.opacity='1'}if(copy)copy.style.display='none';return}badge.textContent='SOULCINEMA · OFF AIR';title.textContent=liveSeen||endedLock?'LIVE BROADCAST ENDED':'THE LIVE ROOM IS QUIET';sub.textContent=liveSeen||endedLock?'Thank you for watching. Stay with SoulCinema for the next live experience.':'The next SoulCinema live experience will begin here.';if(wrap){wrap.style.display='none';wrap.style.visibility='hidden';wrap.style.opacity='0'}if(copy)copy.style.display='block'};const holdEnded=()=>{endedLock=true;probing=false;try{video.pause()}catch(e){}setMode('standby');render()};const promote=()=>{if(!room.classList.contains('active')||endedLock)return;liveSeen=true;lastTime=Number(video.currentTime)||0;lastAdvance=Date.now();probing=false;setMode('live');render()};const probe=()=>{if(!room.classList.contains('active')||probing||endedLock)return;probing=true;try{ensureLiveFeed();liveFeedArmed=true;video.muted=false;const p=video.play();if(p&&p.catch)p.catch(()=>{video.muted=true;const r=video.play();if(r&&r.catch)r.catch(()=>{})});setTimeout(()=>{probing=false;if(!endedLock&&!video.paused&&video.readyState>=2){const t=Number(video.currentTime)||0;setTimeout(()=>{const t2=Number(video.currentTime)||0;if(!endedLock&&!video.paused&&t2>t+.08)promote()},700)}},700)}catch(e){probing=false}};const watchdog=()=>{if(!room.classList.contains('active')||endedLock)return;if(document.body.dataset.liveMode!=='live')return;const t=Number(video.currentTime)||0;if(t>lastTime+.08){lastTime=t;lastAdvance=Date.now()}const finite=Number.isFinite(video.duration)&&video.duration>0;const atEnd=finite&&video.duration-t<.4;if(video.ended||atEnd){holdEnded();return}if(lastAdvance&&Date.now()-lastAdvance>8000){holdEnded()}};const onRoomChange=()=>{const active=room.classList.contains('active');if(active&&!roomWasActive){roomWasActive=true;endedLock=false;liveSeen=false;lastTime=-1;lastAdvance=0;setMode('standby');render();setTimeout(probe,250);if(!watchTimer)watchTimer=setInterval(watchdog,1000)}else if(!active&&roomWasActive){roomWasActive=false;probing=false;if(watchTimer){clearInterval(watchTimer);watchTimer=null}}};new MutationObserver(onRoomChange).observe(room,{attributes:true,attributeFilter:['class']});new MutationObserver(()=>{if(!room.classList.contains('active'))return;const m=document.body.dataset.liveMode;if(endedLock){if(m!=='standby')setMode('standby');render();return}if(['replay','preparing','ended'].includes(m)){setMode('standby');render();return}render()}).observe(document.body,{attributes:true,attributeFilter:['data-live-mode']});video.addEventListener('playing',()=>{if(!endedLock){const start=Number(video.currentTime)||0;setTimeout(()=>{const now=Number(video.currentTime)||0;if(!endedLock&&!video.paused&&now>start+.08)promote()},650)}});video.addEventListener('timeupdate',()=>{if(document.body.dataset.liveMode==='live'&&!endedLock){const t=Number(video.currentTime)||0;if(t>lastTime+.08){lastTime=t;lastAdvance=Date.now()}}});video.addEventListener('ended',()=>{if(room.classList.contains('active'))holdEnded()});video.addEventListener('error',()=>{if(room.classList.contains('active')&&!liveSeen){setMode('standby');render()}});render();onRoomChange()})();<\/script>`;h=h.replace('</body>',js+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;font-family:Georgia,serif;text-align:center"><div><h1>SOULCINEMA</h1><p>Loading the private cinematic experience…</p></div></main>';setTimeout(()=>location.reload(),2500)}})();</script></body></html>
