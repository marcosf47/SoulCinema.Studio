<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoulCinema Studio</title><style>html,body{margin:0;background:#000;color:#f6f0df}</style></head><body><script>(async()=>{try{let h=await fetch('https://raw.githubusercontent.com/marcosf47/SoulCinema.Studio/08134c355c05aa5dde15ac4e16ba0ceb9468f209/public/index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});const css=`<style id="rc209-live-authority">#liveCenter #stateStandby,#liveCenter #stateCountdown,#liveCenter #stateLive,#liveCenter #stateEnd,#liveCenter #stateReplay,#liveCenter #liveRouteStatus,#liveCenter #liveControls,#liveCenter #publicLiveBadge{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}#liveCenter #liveMain{position:relative!important;isolation:isolate!important}body:not([data-live-mode="live"]) #liveCenter #liveMain{background:radial-gradient(circle at 50% 46%,rgba(217,183,96,.12),transparent 27%),radial-gradient(circle at 50% 50%,rgba(255,238,180,.035),transparent 48%),linear-gradient(180deg,#070604 0%,#020202 58%,#000 100%)!important;box-shadow:inset 0 0 120px rgba(0,0,0,.78)}#liveCenter #liveCopy{position:relative!important;z-index:2!important;max-width:680px!important;margin:auto!important;padding:48px 28px!important;text-align:center!important}#liveCenter #liveTitle{font:400 clamp(30px,3.4vw,48px)/1.05 Georgia,serif!important;color:#f8edcf!important;letter-spacing:.025em!important;text-shadow:0 12px 42px rgba(0,0,0,.85)!important;margin:0 0 14px!important}#liveCenter #liveSubtitle{max-width:560px!important;margin:0 auto!important;color:rgba(255,248,229,.62)!important;font-size:13px!important;line-height:1.7!important}</style>`;h=h.replace('</head>',css+'</head>');const js=`<script id="rc209-live-runtime">(()=>{const room=document.getElementById('liveCenter'),video=document.getElementById('livePlayer'),wrap=document.getElementById('livePlayerWrap'),copy=document.getElementById('liveCopy'),badge=document.getElementById('liveState'),title=document.getElementById('liveTitle'),sub=document.getElementById('liveSubtitle');if(!room||!video||!badge||!title||!sub)return;let roomActive=false,probing=false,liveSeen=false,lastTime=0,lastMove=0,watch=null,retry=null;const setMode=m=>{try{setLiveMode(m)}catch(e){document.body.dataset.liveMode=m}};const render=()=>{const on=document.body.dataset.liveMode==='live';if(on){badge.textContent='● ON AIR · LIVE';title.textContent='SOULCINEMA LIVE';sub.textContent='You are watching a SoulCinema live experience.';if(wrap){wrap.style.display='block';wrap.style.visibility='visible';wrap.style.opacity='1'}if(copy)copy.style.display='none'}else{badge.textContent='SOULCINEMA · OFF AIR';title.textContent=liveSeen?'LIVE BROADCAST ENDED':'THE LIVE ROOM IS QUIET';sub.textContent=liveSeen?'Thank you for watching. Stay with SoulCinema for the next live experience.':'The next SoulCinema live experience will begin here.';if(wrap){wrap.style.display='none';wrap.style.visibility='hidden';wrap.style.opacity='0'}if(copy)copy.style.display='block'}};const promote=()=>{if(!roomActive)return;liveSeen=true;probing=false;lastTime=Number(video.currentTime)||0;lastMove=Date.now();setMode('live');render()};const resetSource=()=>{try{video.pause()}catch(e){}try{video.dataset.feedReady='0'}catch(e){}try{if(liveHls){liveHls.destroy();liveHls=null}}catch(e){}try{video.removeAttribute('src');video.load()}catch(e){}};const probe=()=>{if(!roomActive||probing)return;probing=true;resetSource();try{ensureLiveFeed();liveFeedArmed=true;video.muted=false;const p=video.play();if(p&&p.catch)p.catch(()=>{video.muted=true;const r=video.play();if(r&&r.catch)r.catch(()=>{})})}catch(e){}let a=Number(video.currentTime)||0;setTimeout(()=>{let b=Number(video.currentTime)||0;if(roomActive&&!video.paused&&video.readyState>=2&&(b>a+.05)){promote()}else probing=false},1500)};const ended=()=>{if(!roomActive)return;liveSeen=true;probing=false;resetSource();setMode('standby');render();setTimeout(probe,2500)};const watchdog=()=>{if(!roomActive)return;if(document.body.dataset.liveMode!=='live')return;const t=Number(video.currentTime)||0;if(t>lastTime+.05){lastTime=t;lastMove=Date.now();return}if(video.ended||(lastMove&&Date.now()-lastMove>9000))ended()};const enter=()=>{roomActive=true;liveSeen=false;lastMove=0;lastTime=0;setMode('standby');render();setTimeout(probe,250);if(!watch)watch=setInterval(watchdog,1000);if(!retry)retry=setInterval(()=>{if(roomActive&&document.body.dataset.liveMode!=='live'&&!probing)probe()},4000)};const leave=()=>{roomActive=false;probing=false;if(watch){clearInterval(watch);watch=null}if(retry){clearInterval(retry);retry=null}};const roomChange=()=>{const a=room.classList.contains('active');if(a&&!roomActive)enter();else if(!a&&roomActive)leave()};new MutationObserver(roomChange).observe(room,{attributes:true,attributeFilter:['class']});new MutationObserver(()=>{if(!roomActive)return;if(['replay','preparing','ended'].includes(document.body.dataset.liveMode)){setMode('standby')}render()}).observe(document.body,{attributes:true,attributeFilter:['data-live-mode']});video.addEventListener('playing',()=>{const a=Number(video.currentTime)||0;setTimeout(()=>{const b=Number(video.currentTime)||0;if(roomActive&&!video.paused&&b>a+.05)promote()},700)});video.addEventListener('timeupdate',()=>{if(roomActive&&document.body.dataset.liveMode==='live'){const t=Number(video.currentTime)||0;if(t>lastTime+.05){lastTime=t;lastMove=Date.now()}}});video.addEventListener('ended',ended);video.addEventListener('error',()=>{probing=false;if(roomActive&&document.body.dataset.liveMode!=='live')render()});render();roomChange()})();<\/script>`;h=h.replace('</body>',js+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;font-family:Georgia,serif;text-align:center"><div><h1>SOULCINEMA</h1><p>Loading the private cinematic experience…</p></div></main>';setTimeout(()=>location.reload(),2500)}})();</script></body></html>
