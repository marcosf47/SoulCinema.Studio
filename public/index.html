<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoulCinema Studio</title><style>html,body{margin:0;background:#000;color:#f6f0df}</style></head><body><script>(async()=>{try{let h=await fetch('https://raw.githubusercontent.com/marcosf47/SoulCinema.Studio/08134c355c05aa5dde15ac4e16ba0ceb9468f209/public/index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});const css=`<style id="rc206-live-public-authority">#liveCenter #stateStandby,#liveCenter #stateCountdown,#liveCenter #stateLive,#liveCenter #stateEnd,#liveCenter #stateReplay,#liveCenter #liveRouteStatus,#liveCenter #liveControls,#liveCenter #publicLiveBadge{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}#liveCenter #liveMain{position:relative!important;isolation:isolate!important}body:not([data-live-mode="live"]) #liveCenter #liveMain{background:radial-gradient(circle at 50% 46%,rgba(217,183,96,.12),transparent 27%),radial-gradient(circle at 50% 50%,rgba(255,238,180,.035),transparent 48%),linear-gradient(180deg,#070604 0%,#020202 58%,#000 100%)!important;box-shadow:inset 0 0 120px rgba(0,0,0,.78)}#liveCenter #liveCopy{position:relative!important;z-index:2!important;max-width:680px!important;margin:auto!important;padding:48px 28px!important;text-align:center!important}#liveCenter #liveTitle{font:400 clamp(30px,3.4vw,48px)/1.05 Georgia,serif!important;color:#f8edcf!important;letter-spacing:.025em!important;text-shadow:0 12px 42px rgba(0,0,0,.85)!important;margin:0 0 14px!important}#liveCenter #liveSubtitle{max-width:560px!important;margin:0 auto!important;color:rgba(255,248,229,.62)!important;font-size:13px!important;line-height:1.7!important}</style>`;h=h.replace('</head>',css+'</head>');const js=`<script id="rc206-live-runtime">(()=>{const room=document.getElementById('liveCenter'),video=document.getElementById('livePlayer'),wrap=document.getElementById('livePlayerWrap'),copy=document.getElementById('liveCopy'),badge=document.getElementById('liveState'),title=document.getElementById('liveTitle'),sub=document.getElementById('liveSubtitle');if(!room||!video||!badge||!title||!sub)return;let probing=false,retryTimer=null,watchTimer=null,lastTime=-1,lastAdvance=Date.now(),liveSeen=false;try{sessionStorage.removeItem('soulcinema:lastBroadcastEndedAt')}catch(e){}const render=()=>{const live=document.body.dataset.liveMode==='live';if(live){badge.textContent='● ON AIR · LIVE';title.textContent='SOULCINEMA LIVE';sub.textContent='You are watching a SoulCinema live experience.';if(wrap){wrap.style.display='block';wrap.style.visibility='visible';wrap.style.opacity='1'}if(copy)copy.style.display='none'}else{badge.textContent='SOULCINEMA · OFF AIR';title.textContent=liveSeen?'LIVE BROADCAST ENDED':'THE LIVE ROOM IS QUIET';sub.textContent=liveSeen?'Thank you for watching. Stay with SoulCinema for the next live experience.':'The next SoulCinema live experience will begin here.';if(wrap)wrap.style.display='none';if(copy)copy.style.display='block'}};const setOff=()=>{probing=false;try{setLiveMode('standby')}catch(e){document.body.dataset.liveMode='standby'}render()};const promote=()=>{if(!room.classList.contains('active'))return;liveSeen=true;lastAdvance=Date.now();lastTime=video.currentTime||0;probing=false;try{setLiveMode('live')}catch(e){document.body.dataset.liveMode='live'}render()};const probe=()=>{if(!room.classList.contains('active')||probing)return;probing=true;try{ensureLiveFeed();liveFeedArmed=true;video.muted=false;const p=video.play();if(p&&p.catch)p.catch(()=>{video.muted=true;const r=video.play();if(r&&r.catch)r.catch(()=>{probing=false})});setTimeout(()=>{probing=false;if(!video.paused&&video.readyState>=2)promote()},900)}catch(e){probing=false}};const watchdog=()=>{if(!room.classList.contains('active'))return;const t=Number(video.currentTime)||0;if(document.body.dataset.liveMode==='live'){if(t>lastTime+.12){lastTime=t;lastAdvance=Date.now()}const atEnd=Number.isFinite(video.duration)&&video.duration>0&&video.duration-t<.35;if(video.ended||atEnd||video.paused||Date.now()-lastAdvance>6500){setOff();setTimeout(probe,1200)}}else probe()};new MutationObserver(()=>{if(room.classList.contains('active')){lastAdvance=Date.now();lastTime=Number(video.currentTime)||-1;probe();if(!retryTimer)retryTimer=setInterval(probe,3000);if(!watchTimer)watchTimer=setInterval(watchdog,1000)}else{if(retryTimer){clearInterval(retryTimer);retryTimer=null}if(watchTimer){clearInterval(watchTimer);watchTimer=null}}}).observe(room,{attributes:true,attributeFilter:['class']});new MutationObserver(()=>{if(room.classList.contains('active')&&['replay','preparing','ended'].includes(document.body.dataset.liveMode)){setOff();return}render()}).observe(document.body,{attributes:true,attributeFilter:['data-live-mode']});video.addEventListener('playing',promote);video.addEventListener('timeupdate',()=>{if(document.body.dataset.liveMode==='live'){const t=Number(video.currentTime)||0;if(t>lastTime+.12){lastTime=t;lastAdvance=Date.now()}}});video.addEventListener('ended',()=>{if(room.classList.contains('active'))setOff()});video.addEventListener('pause',()=>{if(room.classList.contains('active')&&liveSeen)setTimeout(()=>{if(video.paused)setOff()},1200)});video.addEventListener('error',()=>{if(room.classList.contains('active'))setOff()});render()})();<\/script>`;h=h.replace('</body>',js+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;font-family:Georgia,serif;text-align:center"><div><h1>SOULCINEMA</h1><p>Loading the private cinematic experience…</p></div></main>';setTimeout(()=>location.reload(),2500)}})();</script></body></html>
