dedLock&&!video.paused&&video.readyState>=2&&b>a+.05)promote();else probing=false},1500)};const holdEnded=()=>{if(!roomActive||endedLock)return;endedLock=true;liveSeen=true;probing=false;resumeBusy=false;if(retry){clearInterval(retry);retry=null}resetSource();setMode('standby');render();if(!resume)resume=setInterval(checkNewLive,4000)};function checkNewLive(){if(!roomActive||!endedLock||resumeBusy)return;resumeBusy=true;resetSource();try{ensureLiveFeed();liveFeedArmed=true;video.muted=true;const p=video.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}const a=Number(video.currentTime)||0;setTimeout(()=>{const b=Number(video.currentTime)||0;const moving=!video.paused&&video.readyState>=2&&b>a+.20;if(moving){setTimeout(()=>{const c=Number(video.currentTime)||0;if(roomActive&&endedLock&&!video.paused&&c>b+.20){if(resume){clearInterval(resume);resume=null}promote();return}resetSource();resumeBusy=false;render()},1600)}else{resetSource();resumeBusy=false;render()}},1600)}const watchdog=()=>{if(!roomActive||endedLock||document.body.dataset.liveMode!=='live')return;const t=Number(video.currentTime)||0;if(t>lastTime+.05){lastTime=t;lastMove=Date.now();return}if(video.ended||(lastMove&&Date.now()-lastMove>9000))holdEnded()};const enter=()=>{roomActive=true;probing=false;endedLock=false;liveSeen=false;lastTime=0;lastMove=0;setMode('standby');render();setTimeout(probe,250);if(!watch)watch=setInterval(watchdog,1000);if(!retry)retry=setInterval(()=>{if(roomActive&&!endedLock&&document.body.dataset.liveMode!=='live'&&!probing)probe()},4000)};const leave=()=>{roomActive=false;probing=false;endedLock=false;resumeBusy=false;if(watch){clearInterval(watch);watch=null}if(retry){clearInterval(retry);retry=null}if(resume){clearInterval(resume);resume=null}resetSource()};const roomChange=()=>{const a=room.classList.contains('active');if(a&&!roomActive)enter();else if(!a&&roomActive)leave()};new MutationObserver(roomChange).observe(room,{attributes:true,attributeFilter:['class']});new Mutati
