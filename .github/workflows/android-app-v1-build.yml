name: SoulCinema Android App V1 Build
"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [soulcinema-app-v1]
    paths:
      - "app/**"
      - "public/app/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-app-v1-build.yml"
      - "app/ANDROID-BUILD-TRIGGER"
permissions:
  contents: read
jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and sync isolated Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build Android debug package
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build unsigned Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: soulcinema-app-v1-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
