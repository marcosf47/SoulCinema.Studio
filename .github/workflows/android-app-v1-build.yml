name: SoulCinema Android App V1 Build
"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [soulcinema-app-v1]
    paths:
      - "app/**"
      - "public/app/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-app-v1-build.yml"
      - "app/ANDROID-BUILD-TRIGGER"
permissions:
  contents: read
jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and sync isolated Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build Android debug package
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Configure Play upload signing when secrets exist
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_STORE_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/soulcinema-upload.jks
          cat >> android/gradle.properties <<EOF
SOULCINEMA_STORE_FILE=soulcinema-upload.jks
SOULCINEMA_KEY_ALIAS=$ANDROID_KEY_ALIAS
SOULCINEMA_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
SOULCINEMA_STORE_PASSWORD=$ANDROID_STORE_PASSWORD
EOF
      - name: Patch Android release signing config when secrets exist
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_STORE_PASSWORD != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          marker="    buildTypes {"
          signing="""    signingConfigs {
        release {
            storeFile file(SOULCINEMA_STORE_FILE)
            storePassword SOULCINEMA_STORE_PASSWORD
            keyAlias SOULCINEMA_KEY_ALIAS
            keyPassword SOULCINEMA_KEY_PASSWORD
        }
    }
"""
          if "signingConfigs {" not in s:
              s=s.replace(marker, signing+marker)
          s=s.replace("release {\n", "release {\n            signingConfig signingConfigs.release\n", 1)
          p.write_text(s)
          PY
      - name: Build Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Verify release bundle exists
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: soulcinema-app-v1-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
