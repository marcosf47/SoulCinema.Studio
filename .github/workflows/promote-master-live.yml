name: Promote SoulCinema MASTER Live
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-master-live.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild RC196 MASTER
        run: |
          mkdir -p public
          cat preview-payload/part0.txt preview-payload/part1.txt preview-payload/part2.txt preview-payload/part3.txt preview-payload/part4.txt preview-payload/part5.txt preview-payload/part6.txt preview-payload/part7.txt preview-payload/part8.txt preview-payload/part9.txt | base64 -d | gzip -d > public/index.html
      - name: Apply RC197 Music Discovery readability
        env:
          RC197_CSS_B64: 
        run: |
          python3 -c "from pathlib import Path; import os,base64; p=Path('public/index.html'); s=p.read_text(encoding='utf-8'); css=base64.b64decode(os.environ['RC197_CSS_B64']).decode(); marker='id=\"rc197-music-discovery-readability\"'; p.write_text(s if marker in s else s.replace('</head>',css+'\n</head>',1),encoding='utf-8'); assert marker in p.read_text(encoding='utf-8')"
      - name: Commit production RC197
        run: |
          git config user.name "SoulCinema C.D."
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "LIVE: RC197 Music Discovery readability"
          git push origin HEAD:main
