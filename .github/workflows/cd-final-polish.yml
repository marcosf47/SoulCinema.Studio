name: SoulCinema CD Final Polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-final-polish.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ep-final-preview-20260904
      - name: Remove Production Room QA label only
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="production-note">ATELIER EXPERIENCE · RC11.13.38</div>'
          new='<div class="production-note"></div>'
          if old not in s: raise SystemExit('Production label target missing; refusing broad edit')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit Production Room polish
        run: |
          git config user.name 'SoulCinema C.D.'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Final QA polish: clean Production Room footer'
          git push origin HEAD:ep-final-preview-20260904
