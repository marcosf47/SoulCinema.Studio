name: SoulCinema Direct Vercel
on:
  push:
    branches: [main]
    paths: [.github/workflows/mobile-direct-vercel.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC444
        run: python3 .github/scripts/rc444.py
      - name: Verify RC444
        run: 'grep -q "RC444 MOBILE LIVE LANDSCAPE ONE-TOUCH FULLSCREEN GATE" public/index.html && ! grep -q "rc443-mobile-live-landscape-tap-true-fullscreen" public/index.html && grep -q "RC437 MOBILE LIVE NATIVE FULLSCREEN AUTHORITY" public/index.html && grep -q "RC433 NATIVE MOBILE LIVE FULLSCREEN ONLY" public/index.html && grep -q "RC418 THEATER FULLSCREEN EXIT ISOLATION" public/index.html && grep -q "RC417 NATIVE THEATER FULLSCREEN ONLY" public/index.html && grep -q "RC414 MOBILE CINEMATIC PORTALS REBUILD" public/index.html'ndex.html && ! grep -q "rc442-single-mobile-live-landscape-authority" public/index.html && ! grep -q "rc439-mobile-live-entry-true-fullscreen-lock" public/index.html && ! grep -q "rc441-mobile-live-landscape-gate-lobby-cleanup" public/index.html && grep -q "RC437 MOBILE LIVE NATIVE FULLSCREEN AUTHORITY" public/index.html && grep -q "RC433 NATIVE MOBILE LIVE FULLSCREEN ONLY" public/index.html && grep -q "RC418 THEATER FULLSCREEN EXIT ISOLATION" public/index.html && grep -q "RC417 NATIVE THEATER FULLSCREEN ONLY" public/index.html && grep -q "RC414 MOBILE CINEMATIC PORTALS REBUILD" public/index.html'
      - name: Commit source
        run: git config user.name 'SoulCinema Direct Deploy' && git config user.email 'actions@users.noreply.github.com' && git add public/index.html && git commit -m 'RC444 precise mobile Live landscape one-touch fullscreen' && git push origin HEAD:main
