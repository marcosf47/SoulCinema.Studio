name: SoulCinema Direct Vercel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC431
        run: python3 .github/scripts/rc431.py
      - name: Verify RC431 mobile Live isolation
        run: grep -q 'RC431 MOBILE LIVE IFRAME FULLSCREEN PERMISSION' public/index.html && grep -q 'rc431-mobile-live-iframe-fullscreen-permission' public/index.html && grep -q "f.setAttribute('allowfullscreen','')" public/index.html && ! grep -q 'rc430-mobile-only-live-fullscreen-recovery' public/index.html && ! grep -q 'rc429-live-fullscreen-user-activation-bridge' public/index.html && grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html && grep -q 'RC425 MOBILE THEATER STAGE GUARD' public/index.html && grep -q 'RC424 DISTINCT FEATURE FILM HANDOFF' public/index.html && grep -q 'RC418 THEATER FULLSCREEN EXIT ISOLATION' public/index.html && grep -q 'RC417 NATIVE THEATER FULLSCREEN ONLY' public/index.html && grep -q 'RC414 MOBILE CINEMATIC PORTALS REBUILD' public/index.html
      - name: Commit source
        run: git config user.name 'SoulCinema Direct Deploy' && git config user.email 'actions@users.noreply.github.com' && git add public/index.html && git commit -m 'RC431 mobile Live iframe fullscreen permission recovery' && git push origin HEAD:main
