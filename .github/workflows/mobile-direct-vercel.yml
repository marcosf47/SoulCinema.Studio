name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC264 engine-level mobile skip fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC264 MASTER ENGINE MOBILE SKIP FIX'

          if marker not in html:
              old="function showPortals(){clearTimers();heart.classList.remove('show');premiere.classList.remove('show');$('#skip').style.display='none';chapter.innerHTML='<small>ACT V · THE CHOICE</small><h2>Choose your next chapter.</h2><p>Navigation appears only after the visitor has entered the world.</p>';portals.classList.add('show');setDot(3)}"
              if html.count(old)!=1:
                  raise SystemExit(f'Expected exactly one original showPortals(), found {html.count(old)}; refusing to guess')

              new="""function showPortals(){
 // RC264 MASTER ENGINE MOBILE SKIP FIX
 clearTimers();
 heart.classList.remove('show');
 premiere.classList.remove('show');
 $('#skip').style.display='none';
 chapter.innerHTML='<small>ACT V · THE CHOICE</small><h2>Choose your next chapter.</h2><p>Navigation appears only after the visitor has entered the world.</p>';
 portals.classList.add('show');
 setDot(3);
 if(matchMedia('(max-width:700px)').matches){
   try{lobbyVideo.pause()}catch(_e){}
   lobby.classList.add('portal-mode');
   const fadeEl=$('#fade'); if(fadeEl)fadeEl.classList.remove('on');
   const journeyEl=$('#journeyTransition'); if(journeyEl){journeyEl.classList.remove('on');journeyEl.setAttribute('aria-hidden','true')}
   if(document.body){document.body.dataset.scene='lobby';document.body.dataset.experience='portal_mode'}
 }
}"""
              html=html.replace(old,new,1)

              listener="    if(skipBtn)skipBtn.addEventListener('click',(e)=>{e.preventDefault();e.stopImmediatePropagation();hardSkip();},true);\n"
              if html.count(listener)!=1:
                  raise SystemExit(f'Expected exactly one RC262 skip listener, found {html.count(listener)}; refusing to guess')
              html=html.replace(listener,'',1)

              for start_id, close_tag in [
                  ('<script id="rc263-mobile-skip-event-owner">','</script>'),
                  ('<style id="rc263-mobile-skip-hitbox-lock">','</style>')
              ]:
                  count=html.count(start_id)
                  if count not in (0,1):
                      raise SystemExit(f'Unexpected {start_id} count {count}; refusing to guess')
                  if count==1:
                      s=html.index(start_id)
                      e=html.index(close_tag,s)+len(close_tag)
                      html=html[:s]+html[e:]

              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC264
        run: |
          grep -q 'RC264 MASTER ENGINE MOBILE SKIP FIX' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html
          ! grep -q 'rc263-mobile-skip-event-owner' public/index.html
          ! grep -q 'rc263-mobile-skip-hitbox-lock' public/index.html
          ! grep -q "if(skipBtn)skipBtn.addEventListener('click'.*hardSkip" public/index.html

      - name: Lock RC264 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC264 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC264 master engine-level mobile skip fix"
            git push origin HEAD:main
          fi
