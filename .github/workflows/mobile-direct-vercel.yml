name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC299 desktop Live Center luxury larger screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- RC299 DESKTOP LIVE CENTER LUXURY LARGER SCREEN -->'
          anchor='\n<!-- RC298 DESKTOP LIVE CENTER FULLSCREEN CONTROL -->'
          if marker not in html:
              if html.count(anchor)!=1:
                  raise SystemExit(f'RC298 anchor count={html.count(anchor)}; refusing to guess')
              patch=r'''
<!-- RC299 DESKTOP LIVE CENTER LUXURY LARGER SCREEN -->
<style id="rc299-desktop-live-luxury-larger-screen">
@media (min-width:861px){
  #liveCenter #livePlayerWrap{
    width:min(1480px,94vw)!important;
    max-width:94vw!important;
    aspect-ratio:16/9!important;
    margin-left:auto!important;
    margin-right:auto!important;
    border:1px solid rgba(217,183,96,.58)!important;
    border-radius:22px!important;
    overflow:hidden!important;
    background:#000!important;
    box-shadow:0 34px 100px rgba(0,0,0,.72),0 0 0 1px rgba(255,239,185,.045) inset,0 0 46px rgba(217,183,96,.10)!important;
  }
  #liveCenter #livePlayerWrap iframe,
  #liveCenter #livePlayerWrap video{
    width:100%!important;
    height:100%!important;
    border-radius:inherit!important;
  }
  #liveCenter #rc298LiveFullscreen{
    right:18px!important;
    bottom:18px!important;
    width:48px!important;
    height:48px!important;
    min-width:48px!important;
    min-height:48px!important;
    border-color:rgba(242,215,131,.82)!important;
    background:linear-gradient(180deg,rgba(34,27,12,.82),rgba(0,0,0,.90))!important;
    box-shadow:0 12px 32px rgba(0,0,0,.48),0 0 24px rgba(217,183,96,.12)!important;
  }
}
</style>
'''
              html=html.replace(anchor,'\n'+patch+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC299 and preserve locks
        run: |
          grep -q 'RC299 DESKTOP LIVE CENTER LUXURY LARGER SCREEN' public/index.html
          grep -q 'RC298 DESKTOP LIVE CENTER FULLSCREEN CONTROL' public/index.html
          grep -q 'RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT' public/index.html
          grep -q 'RC277 DESKTOP LIVE CENTER RETURN' public/index.html
          grep -q 'RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Commit RC299 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC299 already applied"
          else
            git add public/index.html
            git commit -m "RC299 desktop Live Center luxury larger screen"
            git push origin HEAD:main
          fi
