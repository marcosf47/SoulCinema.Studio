name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC404 mobile premiere reveal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          h=re.sub(r'<!-- RC403 MOBILE THEATER PREMIERE LIFECYCLE RESTORE -->.*?<script id="rc403-mobile-theater-premiere-lifecycle-restore">.*?</script>\s*','',h,flags=re.S)
          marker='<!-- RC404 MOBILE THEATER PREMIERE REVEAL -->'
          patch=marker+'''\n<script id="rc404-mobile-theater-premiere-reveal">\n(()=>{\n const mobile=()=>matchMedia('(max-width:860px)').matches||matchMedia('(pointer:coarse)').matches;\n const opening='https://tfamln4qsost6j00.public.blob.vercel-storage.com/featured-premiere.mp4';\n const start=()=>{\n   if(!mobile())return;\n   const theater=document.getElementById('screeningTheater'),v=document.getElementById('theaterPlayer'),poster=document.getElementById('theaterPoster');\n   if(!theater?.classList.contains('active')||!v)return;\n   try{theaterHandoffBusy=false;theaterStage='opening'}catch(_){}\n   try{v.pause()}catch(_){};v.classList.remove('theater-handoff','theater-portal-push','theater-feature-enter');\n   v.dataset.scStage='opening';if((v.currentSrc||v.src||'')!==opening){v.src=opening;try{v.load()}catch(_){}}\n   try{v.currentTime=0}catch(_){};v.muted=false;v.playsInline=true;v.setAttribute('playsinline','');\n   const reveal=()=>{poster?.classList.add('hidden');v.removeEventListener('playing',reveal)};v.addEventListener('playing',reveal);\n   const play=()=>{const p=v.play();if(p?.catch)p.catch(()=>{v.muted=true;const q=v.play();q?.catch?.(()=>{})})};\n   if(v.readyState>=2)play();else{v.addEventListener('canplay',play,{once:true});setTimeout(play,180)}\n };\n document.addEventListener('click',e=>{if(!mobile())return;const portal=e.target.closest?.('#portals .portal[data-room="Screening Theater"],#portals .portal[data-mobile-room="Screening Theater"]');if(portal){setTimeout(start,80);setTimeout(start,260)}},true);\n const mo=new MutationObserver(()=>{if(mobile()&&document.getElementById('screeningTheater')?.classList.contains('active'))setTimeout(start,0)});\n const t=document.getElementById('screeningTheater');if(t)mo.observe(t,{attributes:true,attributeFilter:['class']});\n})();\n</script>\n'''
          if marker not in h:
              if '</body>' not in h: raise SystemExit('Missing body anchor')
              h=h.replace('</body>',patch+'</body>',1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Verify RC404 surgical state
        run: |
          grep -q 'rc404-mobile-theater-premiere-reveal' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
          grep -q 'featured-premiere.mp4' public/index.html
          grep -q 'mwen-poukont-mwen-film.mp4' public/index.html
          ! grep -q 'rc403-mobile-theater-premiere-lifecycle-restore' public/index.html
      - name: Commit RC404 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC404 already applied'; else git add public/index.html && git commit -m 'RC404 restore mobile premiere reveal and autoplay' && git push origin HEAD:main; fi
