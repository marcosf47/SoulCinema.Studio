name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC266 mobile portal media freeze + native scroll owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC266 MASTER MOBILE PORTAL MEDIA FREEZE + NATIVE SCROLL OWNER'
          if marker not in html:
              patch=base64.b64decode('').decode('utf-8')
              anchor='</body>'
              if html.count(anchor)!=1:
                  raise SystemExit('Expected one </body>; refusing to guess')
              html=html.replace(anchor,patch+'\n'+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC266
        run: |
          grep -q 'RC266 MASTER MOBILE PORTAL MEDIA FREEZE + NATIVE SCROLL OWNER' public/index.html
          grep -q 'rc266-mobile-portal-native-owner' public/index.html
          grep -q 'rc266-mobile-portal-native-scroll-lock' public/index.html
          grep -q 'RC265 MASTER MOBILE SKIP COORDINATE + SEQUENCE LOCK' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC266 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC266 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC266 master mobile portal media freeze and native scroll owner"
            git push origin HEAD:main
          fi
