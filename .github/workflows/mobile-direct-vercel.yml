name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC315 remove public sound button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          html = p.read_text(encoding='utf-8')
          start = '<!-- RC314 DESKTOP LIVE SOUND USER ACTIVATION -->'
          end = '<!-- RC313 DESKTOP LIVE PANEL ALIGN + LOBBY UNDER PANEL -->'
          if start in html:
              a = html.index(start)
              b = html.index(end, a)
              html = html[:a] + html[b:]
              p.write_text(html, encoding='utf-8')
          PY

      - name: Verify RC315 and preserve locks
        run: |
          ! grep -q 'rc314LiveSound' public/index.html
          grep -q 'RC313 DESKTOP LIVE PANEL ALIGN + LOBBY UNDER PANEL' public/index.html
          grep -q 'RC312 DESKTOP LIVE NOW PANEL + RETURN LOBBY' public/index.html
          grep -q 'RC310 DESKTOP LIVE CENTER HARD SIZE CAP' public/index.html
          grep -q 'RC305 DESKTOP LIVE CENTER IFRAME STATE AUTHORITY' public/index.html
          grep -q 'controls=true&muted=false&autoplay=true&playsInline=true' public/index.html
          grep -q 'RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Commit RC315 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then
            echo 'RC315 already applied'
          else
            git add public/index.html
            git commit -m 'RC315 remove public sound button'
            git push origin HEAD:main
          fi
