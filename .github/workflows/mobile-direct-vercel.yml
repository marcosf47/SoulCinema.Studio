name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC263 exact mobile skip event-owner fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC263 MASTER MOBILE SKIP EVENT OWNER FIX'
          if marker not in html:
              skip_count=html.count('id="skip"')
              if skip_count != 1:
                  raise SystemExit(f'Expected exactly one #skip button, found {skip_count}; refusing to guess')
              if 'function showPortals()' not in html:
                  raise SystemExit('showPortals() not found; refusing to guess')
              patch=r'''
<script id="rc263-mobile-skip-event-owner">
(()=>{
  'use strict';
  const boot=()=>{
    if(!matchMedia('(max-width:700px)').matches)return;
    const oldBtn=document.getElementById('skip');
    if(!oldBtn||!oldBtn.parentNode)return;

    /* RC263 MASTER MOBILE SKIP EVENT OWNER FIX */
    const btn=oldBtn.cloneNode(true);
    btn.removeAttribute('onclick');
    oldBtn.parentNode.replaceChild(btn,oldBtn);

    let fired=false;
    const forward=(e)=>{
      if(e){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();}
      if(fired)return;
      fired=true;

      if(typeof window.clearTimers==='function')window.clearTimers();
      else if(typeof clearTimers==='function')clearTimers();

      const lobby=document.getElementById('lobby');
      const portals=document.getElementById('portals');
      const heart=lobby&&lobby.querySelector('.heart-focus');
      const premiere=document.getElementById('premiereCard');
      const fade=document.getElementById('fade');
      const journey=document.getElementById('journeyTransition');

      if(lobby){
        lobby.querySelectorAll('video,audio').forEach(m=>{try{m.pause()}catch(_e){}});
      }
      if(heart)heart.classList.remove('show');
      if(premiere)premiere.classList.remove('show');
      if(fade)fade.classList.remove('on');
      if(journey){journey.classList.remove('on');journey.setAttribute('aria-hidden','true');}
      if(portals)portals.classList.add('show');
      if(lobby)lobby.classList.add('portal-mode');
      btn.style.display='none';
      if(document.body){document.body.dataset.scene='lobby';document.body.dataset.experience='portal_mode';}

      requestAnimationFrame(()=>{
        if(portals)portals.classList.add('show');
        if(lobby)lobby.classList.add('portal-mode');
      });
      setTimeout(()=>{fired=false},400);
    };

    btn.addEventListener('pointerup',forward,true);
    btn.addEventListener('click',forward,true);
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});
  else boot();
})();
</script>
<style id="rc263-mobile-skip-hitbox-lock">
@media(max-width:700px){
  #lobby #skip{z-index:120!important;pointer-events:auto!important;touch-action:manipulation!important}
  #lobby.portal-mode #skip{display:none!important}
  #lobby.portal-mode .chapter,
  #lobby.portal-mode .heart-focus,
  #lobby.portal-mode #premiereCard{display:none!important}
  #lobby.portal-mode #portals{opacity:1!important;visibility:visible!important;transform:none!important;z-index:100!important;pointer-events:auto!important}
}
</style>
'''
              anchor='</body>'
              if html.count(anchor)!=1:
                  raise SystemExit('Expected one </body>; refusing to guess')
              html=html.replace(anchor,patch+'\n'+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC263
        run: |
          grep -q 'RC263 MASTER MOBILE SKIP EVENT OWNER FIX' public/index.html
          grep -q 'RC262 MASTER MOBILE SKIP FORWARD FIX' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC263 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC263 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC263 master mobile skip event owner fix"
            git push origin HEAD:main
          fi
