name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC260 master fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          html = p.read_text(encoding='utf-8')
          old = """    const hardSkip=()=>{
      cleanLobbyState();
      if(!lobby?.classList.contains('active'))activateLobby();
      setTimeout(()=>{
        if(typeof window.showPortals==='function')window.showPortals();
        else if(typeof showPortals==='function')showPortals();
        else portals?.classList.add('show');
      },220);
    };"""
          new = """    const hardSkip=()=>{
      /* RC260 MASTER FIX */
      if(typeof clearTimers==='function')clearTimers();
      if(!lobby?.classList.contains('active')){
        document.querySelectorAll('.scene.active').forEach(s=>s.classList.remove('active'));
        lobby?.classList.add('active');
      }
      q('#lobby .heart-focus')?.classList.remove('show');
      q('#lobby .premiere-card')?.classList.remove('show');
      if(fade)fade.classList.remove('on');
      if(journey){journey.classList.remove('on');journey.setAttribute('aria-hidden','true');}
      portals?.classList.add('show');
      lobby?.classList.add('portal-mode');
      if(skipBtn)skipBtn.style.display='none';
      if(document.body){document.body.dataset.scene='lobby';document.body.dataset.experience='portal_mode';}
    };"""
          if 'RC260 MASTER FIX' not in html:
              if html.count(old) != 1:
                  raise SystemExit('Exact hardSkip block mismatch; aborting')
              html = html.replace(old, new, 1)
          start = html.find('<script id="rc259-mobile-skip-to-portals-fix">')
          if start >= 0:
              end = html.find('</script>', start)
              if end < 0:
                  raise SystemExit('Broken RC259 script; aborting')
              html = html[:start] + html[end+9:]
          p.write_text(html, encoding='utf-8')
          PY

      - name: Verify RC260
        run: |
          grep -q 'RC260 MASTER FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC260 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC260 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC260 master mobile skip fix"
            git push origin HEAD:main
          fi
