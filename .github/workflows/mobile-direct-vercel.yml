name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair RC281 Theater return syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          old="function returnFromTheater(){const v=$('#theaterPlayer');if(v)v.pause();journeyTransition('THE GRAND LOBBY','RETURNING','CHOOSE YOUR NEXT CHAPTER',()=>{// RC281 SCREENING THEATER RETURN — SINGLE CINEMATIC HANDOFF;SceneManager.goTo('lobby');screeningTheater.classList.remove('active');lobby.classList.add('active');transitionCount++;updateRuntimeMonitor();setTimeout(showPortals,420)})}"
          new="function returnFromTheater(){const v=$('#theaterPlayer');if(v)v.pause();journeyTransition('THE GRAND LOBBY','RETURNING','CHOOSE YOUR NEXT CHAPTER',()=>{/* RC281 SCREENING THEATER RETURN — SINGLE CINEMATIC HANDOFF */SceneManager.goTo('lobby');screeningTheater.classList.remove('active');lobby.classList.add('active');transitionCount++;updateRuntimeMonitor();setTimeout(showPortals,420)})}"
          if html.count(old)!=1:
              raise SystemExit(f'Expected exactly one malformed RC281 Theater return, found {html.count(old)}; refusing to guess')
          html=html.replace(old,new,1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC281 repair and locked layers
        run: |
          grep -q 'RC281 SCREENING THEATER RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q "screeningTheater.classList.remove('active');lobby.classList.add('active')" public/index.html
          if grep -q "()=>{// RC281 SCREENING THEATER RETURN" public/index.html; then
            echo 'Malformed RC281 line comment still present'; exit 1
          fi
          grep -q 'RC280 LIVE SAFE NATIVE RATIO FILL' public/index.html
          grep -q 'RC279 LIVE INNER SCREEN ALIGNMENT' public/index.html
          grep -q 'RC278 LIVE CENTER CINEMA WALL SCALE' public/index.html
          grep -q 'RC277 DESKTOP LIVE CENTER RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC276 LIVE AUTOPLAY BROADCAST ONLY PLAYER' public/index.html
          grep -q 'RC275 SOULCINEMA LIVE CENTER VPS EMBED RECOVERY' public/index.html
          grep -q 'RC272 DESKTOP LIVE TRUTH STATE + STALE CLIP GUARD' public/index.html
          grep -q 'RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP' public/index.html
          grep -q 'RC269 MASTER MOBILE MEDIA AUTHORITY LOCK' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC281 repair into source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "RC281 repair Theater return script syntax"
          git push origin HEAD:main
