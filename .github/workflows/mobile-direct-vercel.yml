name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC305 desktop Live Center iframe state authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- RC305 DESKTOP LIVE CENTER IFRAME STATE AUTHORITY -->'
          anchor='<!-- RC304 DESKTOP LIVE CENTER RECOVERY OWNER -->'
          patch=r'''<!-- RC305 DESKTOP LIVE CENTER IFRAME STATE AUTHORITY -->
<style id="rc305-desktop-live-iframe-authority-css">
@media(min-width:861px){
  #liveCenter.active #livePlayerWrap{display:block!important;}
  #liveCenter.active #liveCopy{display:none!important;}
  #liveCenter.active #rc275LiveFrame{
    display:block!important;
    visibility:visible!important;
    opacity:1!important;
    pointer-events:auto!important;
  }
}
</style>
<script id="rc305-desktop-live-iframe-authority">
(()=>{
  'use strict';
  if(!matchMedia('(min-width:861px)').matches)return;
  const FEED='https://live.soulcinema.studio/soulcinemad/?controls=true&muted=false&autoplay=true&playsInline=true';
  const room=document.getElementById('liveCenter');
  const wrap=document.getElementById('livePlayerWrap');
  const copy=document.getElementById('liveCopy');
  const state=document.getElementById('liveState');
  if(!room||!wrap)return;
  const own=()=>{
    if(!room.classList.contains('active'))return;
    const frame=document.getElementById('rc275LiveFrame');
    if(!frame)return;
    if(document.body.dataset.liveMode!=='live')document.body.dataset.liveMode='live';
    wrap.style.setProperty('display','block','important');
    if(copy)copy.style.setProperty('display','none','important');
    frame.style.setProperty('display','block','important');
    frame.style.setProperty('visibility','visible','important');
    frame.style.setProperty('opacity','1','important');
    frame.style.setProperty('pointer-events','auto','important');
    if(frame.getAttribute('src')!==FEED)frame.setAttribute('src',FEED);
    if(state)state.textContent='SOULCINEMA \u00b7 ON AIR';
  };
  new MutationObserver(own).observe(document.body,{attributes:true,attributeFilter:['data-live-mode']});
  new MutationObserver(own).observe(room,{attributes:true,attributeFilter:['class']});
  [0,100,500,1000,1800,2200,3000].forEach(ms=>setTimeout(own,ms));
})();
</script>
'''
          if marker not in html:
              if html.count(anchor)!=1:
                  raise SystemExit(f'RC304 anchor count={html.count(anchor)}; refusing to guess')
              html=html.replace(anchor,patch+anchor,1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC305 and preserve locks
        run: |
          grep -q 'RC305 DESKTOP LIVE CENTER IFRAME STATE AUTHORITY' public/index.html
          grep -q 'RC304 DESKTOP LIVE CENTER RECOVERY OWNER' public/index.html
          grep -q 'RC303 DESKTOP LIVE CENTER LUXURY + ALWAYS FULLSCREEN' public/index.html
          grep -q 'RC302 DESKTOP LIVE CENTER FULLSCREEN BUTTON FORCE VISIBLE' public/index.html
          grep -q 'RC301 DESKTOP LIVE CENTER REMOVE LOWER LIVE BADGE' public/index.html
          grep -q 'RC300 DESKTOP LIVE CENTER FIT + NATIVE FULLSCREEN RESTORE' public/index.html
          grep -q 'RC299 DESKTOP LIVE CENTER LUXURY LARGER SCREEN' public/index.html
          grep -q 'RC298 DESKTOP LIVE CENTER FULLSCREEN CONTROL' public/index.html
          grep -q 'RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT' public/index.html
          grep -q 'RC277 DESKTOP LIVE CENTER RETURN' public/index.html
          grep -q 'RC275 SOULCINEMA LIVE CENTER VPS EMBED RECOVERY' public/index.html
          grep -q 'RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Commit RC305 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC305 already applied"
          else
            git add public/index.html
            git commit -m "RC305 desktop Live Center iframe state authority"
            git push origin HEAD:main
          fi
