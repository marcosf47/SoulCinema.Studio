name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC406 master mobile theater landscape fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          # Remove rejected RC405 completely. RC404 premiere engine remains untouched.
          h=re.sub(r'<!-- RC405 MOBILE THEATER LANDSCAPE 16X9 -->\s*<style id="rc405-mobile-theater-landscape-16x9">.*?</style>\s*','',h,flags=re.S)
          marker='<!-- RC406 MASTER MOBILE THEATER LANDSCAPE -->'
          patch=marker+'''\n<style id="rc406-master-mobile-theater-landscape">\n/* One landscape authority. Portrait, desktop, RC404 premiere engine and Live Center are untouched. */\n@media (orientation:landscape) and (pointer:coarse) and (max-width:1100px){\n  html:has(#screeningTheater.active),body:has(#screeningTheater.active){overflow:hidden!important;background:#000!important}\n  #screeningTheater.active{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;overflow:hidden!important;background:#000!important;z-index:2147483000!important}\n  #screeningTheater.active>.theater-bg,#screeningTheater.active>.theater-glow,#screeningTheater.active>.grain{display:none!important}\n  #screeningTheater.active>.center{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;padding:0!important;margin:0!important;overflow:hidden!important;display:block!important;background:#000!important;text-align:left!important}\n  #screeningTheater.active .theater-shell{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;min-height:0!important;margin:0!important;padding:0!important;display:block!important;overflow:hidden!important;background:#000!important;border:0!important;border-radius:0!important;box-shadow:none!important;transform:none!important;filter:none!important;opacity:1!important}\n  #screeningTheater.active .theater-head,#screeningTheater.active .theater-footer,#screeningTheater.active .theater-collection,#screeningTheater.active .theater-collections,#screeningTheater.active [data-theater-collection],#screeningTheater.active .theater-library,#screeningTheater.active .theater-grid{display:none!important;visibility:hidden!important;pointer-events:none!important}\n  #screeningTheater.active .theater-screen-frame{position:fixed!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;width:min(100vw,calc(100dvh * 16 / 9))!important;height:min(100dvh,calc(100vw * 9 / 16))!important;max-width:100vw!important;max-height:100dvh!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:#000!important;box-shadow:none!important;overflow:hidden!important;z-index:2147483100!important}\n  #screeningTheater.active .theater-screen{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:0!important;max-height:none!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:#000!important;overflow:hidden!important;display:block!important}\n  #screeningTheater.active #theaterPlayer{display:block!important;visibility:visible!important;opacity:1!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:#000!important;object-fit:contain!important;transform:none!important;filter:none!important;z-index:2!important}\n  #screeningTheater.active #theaterPoster{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border-radius:0!important;z-index:3!important}\n  #screeningTheater.active #theaterPoster.hidden{visibility:hidden!important;opacity:0!important;pointer-events:none!important}\n  #screeningTheater.active #theaterStatus{z-index:4!important}\n}\n</style>\n<script id="rc406-master-mobile-theater-landscape-guard">\n(()=>{\n const coarse=()=>matchMedia('(pointer:coarse)').matches;\n const landscape=()=>matchMedia('(orientation:landscape)').matches&&innerWidth<=1100&&coarse();\n const sync=()=>{\n   const t=document.getElementById('screeningTheater');\n   document.body.classList.toggle('rc406-theater-landscape',!!(t?.classList.contains('active')&&landscape()));\n };\n addEventListener('orientationchange',()=>setTimeout(sync,80),{passive:true});\n addEventListener('resize',sync,{passive:true});\n new MutationObserver(sync).observe(document.getElementById('screeningTheater')||document.body,{attributes:true,attributeFilter:['class']});\n sync();\n})();\n</script>\n'''
          if marker not in h:
              if '</body>' not in h: raise SystemExit('Missing body anchor')
              h=h.replace('</body>',patch+'</body>',1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Verify RC406 master state
        run: |
          grep -q 'rc406-master-mobile-theater-landscape' public/index.html
          grep -q 'rc404-mobile-theater-premiere-reveal' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
          grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html
          ! grep -q 'rc405-mobile-theater-landscape-16x9' public/index.html
      - name: Commit RC406 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC406 already applied'; else git add public/index.html && git commit -m 'RC406 master mobile theater landscape fix' && git push origin HEAD:main; fi
