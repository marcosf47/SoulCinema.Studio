name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC410 mobile return lifecycle stabilization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          old="""    [80,300,700,1400].forEach(ms=>setTimeout(()=>{\n      if(document.body.dataset.experience==='portal_mode'){\n        resetLocks();scrubRoomState();onlyScene('lobby');\n        l?.classList.add('portal-mode');p?.classList.add('show');\n        document.body.dataset.scene='lobby';\n      }\n    },ms));"""
          new="""    // RC410: one stable portal handoff. Do not repeatedly scrub/rebuild room state after return.\n    requestAnimationFrame(()=>{\n      if(document.body.dataset.experience==='portal_mode'){\n        resetLocks();\n        onlyScene('lobby');\n        l?.classList.add('portal-mode');\n        p?.classList.add('show');\n        p?.style.setProperty('pointer-events','auto','important');\n        document.body.dataset.scene='lobby';\n        delete document.body.dataset.rc375RoomOpening;\n        tapStart=null;\n        lastMobileTap=-10000;\n      }\n    });"""
          if old not in h: raise SystemExit('RC342 goPortals delayed reset block not found')
          h=h.replace(old,new,1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Verify RC410 state
        run: |
          grep -q 'RC410: one stable portal handoff' public/index.html
          grep -q 'rc407-isolated-mobile-theater-landscape-player' public/index.html
          grep -q 'rc404-mobile-theater-premiere-reveal' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
          grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html
          ! grep -q 'rc408-theater-native-fullscreen-gesture' public/index.html
      - name: Commit RC410 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC410 already applied'; else git add public/index.html && git commit -m 'RC410 stabilize mobile room return lifecycle' && git push origin HEAD:main; fi
