name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC267 mobile portal quiet runtime + smooth scroll
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC267 MASTER MOBILE PORTAL QUIET RUNTIME + SMOOTH SCROLL'
          if marker not in html:
              patch=base64.b64decode('').decode('utf-8')
              if html.count('</body>')!=1:
                  raise SystemExit('Expected one </body>; refusing to guess')
              html=html.replace('</body>',patch+'\n</body>',1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC267
        run: |
          grep -q 'RC267 MASTER MOBILE PORTAL QUIET RUNTIME + SMOOTH SCROLL' public/index.html
          grep -q 'rc267-mobile-portal-runtime-lock' public/index.html
          grep -q 'rc267-mobile-portal-smooth-scroll' public/index.html
          grep -q 'RC266 MASTER MOBILE PORTAL MEDIA FREEZE + NATIVE SCROLL OWNER' public/index.html
          grep -q 'RC265 MASTER MOBILE SKIP COORDINATE + SEQUENCE LOCK' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC267 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC267 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC267 master mobile portal quiet runtime and smooth scroll"
            git push origin HEAD:main
          fi
