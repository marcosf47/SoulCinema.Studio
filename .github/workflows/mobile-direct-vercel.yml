name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC405 mobile theater landscape 16x9
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          marker='<!-- RC405 MOBILE THEATER LANDSCAPE 16X9 -->'
          patch=marker+'''\n<style id="rc405-mobile-theater-landscape-16x9">\n@media (max-width:860px) and (orientation:landscape){\n  #screeningTheater.active{background:#000!important;overflow:hidden!important}\n  #screeningTheater.active>.center{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;padding:0!important;margin:0!important;display:block!important;overflow:hidden!important;background:#000!important;z-index:9998!important}\n  #screeningTheater.active .theater-shell{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;min-height:0!important;max-width:none!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:#000!important;box-shadow:none!important;display:block!important;overflow:hidden!important}\n  #screeningTheater.active .theater-head,#screeningTheater.active .theater-collections,#screeningTheater.active .theater-footer{display:none!important}\n  #screeningTheater.active .theater-screen-frame,#screeningTheater.active .theater-screen{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:0!important;max-height:none!important;aspect-ratio:auto!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:#000!important;box-shadow:none!important;overflow:hidden!important}\n  #screeningTheater.active #theaterPlayer{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:contain!important;background:#000!important;border-radius:0!important}\n  #screeningTheater.active #theaterPoster{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border-radius:0!important}\n}\n</style>\n'''
          if marker not in h:
              if '</body>' not in h: raise SystemExit('Missing body anchor')
              h=h.replace('</body>',patch+'</body>',1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Verify RC405 surgical state
        run: |
          grep -q 'rc405-mobile-theater-landscape-16x9' public/index.html
          grep -q 'rc404-mobile-theater-premiere-reveal' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
          grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html
      - name: Commit RC405 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC405 already applied'; else git add public/index.html && git commit -m 'RC405 polish mobile theater landscape 16x9' && git push origin HEAD:main; fi
