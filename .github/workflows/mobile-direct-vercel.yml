name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC269 mobile media authority lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC269 MASTER MOBILE MEDIA AUTHORITY LOCK'
          if marker not in html:
              patch=r'''
<!-- RC269 MASTER MOBILE MEDIA AUTHORITY LOCK -->
<script id="rc269-mobile-media-authority-lock">
(()=>{
  'use strict';
  const mobile=()=>matchMedia('(max-width:700px)').matches;
  const locked=()=>mobile()&&document.body?.dataset.mobilePortalLock==='1';
  const lobby=()=>document.getElementById('lobby');
  const stopAll=()=>{
    if(!mobile())return;
    document.querySelectorAll('#lobby video,#lobby audio,#ambient').forEach(m=>{
      if(!(m instanceof HTMLMediaElement))return;
      try{m.pause()}catch(_e){}
    });
  };
  const setLock=()=>{
    if(!mobile())return;
    document.body.dataset.mobilePortalLock='1';
    stopAll();
  };
  const unlockAtGate=()=>{
    if(!mobile())return;
    const g=document.getElementById('gate');
    if(g?.classList.contains('active')) delete document.body.dataset.mobilePortalLock;
  };
  const harden=(m)=>{
    if(!(m instanceof HTMLMediaElement)||m.dataset.rc269Authority==='1')return;
    m.dataset.rc269Authority='1';
    const nativePlay=m.play.bind(m);
    m.play=function(){
      if(locked()&&(this.closest?.('#lobby')||this.id==='ambient')){
        try{this.pause()}catch(_e){}
        return Promise.resolve();
      }
      return nativePlay();
    };
    m.addEventListener('play',()=>{
      if(locked()&&(m.closest?.('#lobby')||m.id==='ambient')){
        try{m.pause()}catch(_e){}
      }
    },true);
  };
  const arm=()=>{
    if(!mobile())return;
    document.querySelectorAll('#lobby video,#lobby audio,#ambient').forEach(harden);
    const g=document.getElementById('gate');
    const p=document.getElementById('portals');
    const l=lobby();
    unlockAtGate();
    if(l?.classList.contains('portal-mode')||p?.classList.contains('show'))setLock();
    if(g)new MutationObserver(unlockAtGate).observe(g,{attributes:true,attributeFilter:['class']});
    if(l)new MutationObserver(()=>{if(l.classList.contains('portal-mode'))setLock()}).observe(l,{attributes:true,attributeFilter:['class']});
    if(p)new MutationObserver(()=>{if(p.classList.contains('show'))setLock()}).observe(p,{attributes:true,attributeFilter:['class']});
    new MutationObserver(()=>document.querySelectorAll('#lobby video,#lobby audio,#ambient').forEach(harden)).observe(document.body,{childList:true,subtree:true});
  };
  window.addEventListener('pointerdown',e=>{
    if(!mobile())return;
    if(e.target?.closest?.('#skip')) setLock();
  },true);
  window.addEventListener('touchstart',e=>{
    if(!mobile())return;
    if(e.target?.closest?.('#skip')) setLock();
  },{capture:true,passive:true});
  document.addEventListener('play',e=>{
    const m=e.target;
    if(locked()&&m instanceof HTMLMediaElement&&(m.closest?.('#lobby')||m.id==='ambient')){
      try{m.pause()}catch(_e){}
    }
  },true);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',arm,{once:true});else arm();
})();
</script>
'''
              if html.count('</body>')!=1:
                  raise SystemExit('Expected one </body>; refusing to guess')
              html=html.replace('</body>',patch+'\n</body>',1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC269 without touching locked scroll
        run: |
          grep -q 'RC269 MASTER MOBILE MEDIA AUTHORITY LOCK' public/index.html
          grep -q 'rc269-mobile-media-authority-lock' public/index.html
          grep -q "dataset.mobilePortalLock==='1'" public/index.html
          grep -q "m.play=function()" public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'rc268-mobile-native-portal-scroll' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC269 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC269 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC269 master mobile media authority lock"
            git push origin HEAD:main
          fi
