name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC313 align Live Now panel and lobby button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- RC313 DESKTOP LIVE PANEL ALIGN + LOBBY UNDER PANEL -->'
          anchor='<!-- RC312 DESKTOP LIVE NOW PANEL + RETURN LOBBY -->'
          patch='''<!-- RC313 DESKTOP LIVE PANEL ALIGN + LOBBY UNDER PANEL -->
<style id="rc313-desktop-live-panel-lobby-align">
@media (min-width:861px){
  #liveCenter.active #rc307LiveInfo{
    right:54px!important;
    top:158px!important;
  }
  #liveCenter.active #returnLobby{
    left:auto!important;
    right:54px!important;
    top:auto!important;
    bottom:18px!important;
    width:270px!important;
    justify-content:center!important;
    box-sizing:border-box!important;
  }
}
</style>
'''
          if marker not in html:
              if html.count(anchor)!=1:
                  raise SystemExit('RC312 anchor mismatch; refusing to guess')
              html=html.replace(anchor,patch+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC313 and preserve locks
        run: |
          grep -q 'RC313 DESKTOP LIVE PANEL ALIGN + LOBBY UNDER PANEL' public/index.html
          grep -q 'RC312 DESKTOP LIVE NOW PANEL + RETURN LOBBY' public/index.html
          grep -q 'RC310 DESKTOP LIVE CENTER HARD SIZE CAP' public/index.html
          grep -q 'RC305 DESKTOP LIVE CENTER IFRAME STATE AUTHORITY' public/index.html
          grep -q 'RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Commit RC313 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC313 already applied"
          else
            git add public/index.html
            git commit -m "RC313 align Live Now panel and lobby button"
            git push origin HEAD:main
          fi
