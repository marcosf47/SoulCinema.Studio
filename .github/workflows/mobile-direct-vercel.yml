name: SoulCinema Direct Vercel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC421
        run: python3 .github/scripts/rc421.py
      - name: Verify RC421
        run: grep -q 'RC421 THEATER HANDOFF VISUAL MASK' public/index.html && grep -q 'RC420 RESTORE PROVEN THEATER HANDOFF' public/index.html && ! grep -q 'RC419 SEAMLESS THEATER PREMIERE HANDOFF' public/index.html && grep -q 'RC418 THEATER FULLSCREEN EXIT ISOLATION' public/index.html && grep -q "liveRoom?.contains(fs)" public/index.html && grep -q 'RC417 NATIVE THEATER FULLSCREEN ONLY' public/index.html && grep -q 'RC414 MOBILE CINEMATIC PORTALS REBUILD' public/index.html && grep -q 'rc404-mobile-theater-premiere-reveal' public/index.html && grep -q 'rc407-isolated-mobile-theater-landscape-player' public/index.html && grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html && ! grep -q 'RC416 DIRECT MOBILE THEATER FULLSCREEN' public/index.html && ! grep -q 'RC415 MOBILE THEATER FULLSCREEN STABILITY' public/index.html && ! grep -q 'rc408-theater-native-fullscreen-gesture' public/index.html
      - name: Commit source
        run: git config user.name 'SoulCinema Direct Deploy' && git config user.email 'actions@users.noreply.github.com' && git add public/index.html && git commit -m 'RC421 mask theater handoff controls' && git push origin HEAD:main
