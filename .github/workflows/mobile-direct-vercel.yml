name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC401 mobile portal return stabilization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          marker='<!-- RC401 MOBILE PORTAL RETURN STABILIZATION -->'
          patch=marker+'''\n<style id="rc401-mobile-portal-return-style">\n@media (max-width:860px),(pointer:coarse){\n #lobby #portals{touch-action:pan-y!important;}\n #lobby #portals .portal,#lobby #portals button{touch-action:manipulation!important;}\n}\n</style>\n<script id="rc401-mobile-portal-return-stabilization">\n(()=>{\n const mobile=()=>matchMedia('(max-width:860px)').matches||matchMedia('(pointer:coarse)').matches;\n const lobby=()=>document.getElementById('lobby');\n const portals=()=>document.getElementById('portals');\n let lastRoom=false;\n const isLobby=()=>lobby()?.classList.contains('active');\n const repair=()=>{\n   if(!mobile()||!isLobby())return;\n   const p=portals();if(!p)return;\n   p.style.pointerEvents='auto';\n   p.style.touchAction='pan-y';\n   p.removeAttribute('inert');p.setAttribute('aria-hidden','false');\n   [...p.querySelectorAll('.portal,button,[role="button"]')].forEach(el=>{el.style.pointerEvents='auto';el.removeAttribute('inert');});\n   document.documentElement.style.pointerEvents='';document.body.style.pointerEvents='';\n   document.body.classList.remove('rc400-live-landscape');\n   lastRoom=false;\n };\n const note=()=>{if(!mobile())return;if(!isLobby())lastRoom=true;else if(lastRoom){requestAnimationFrame(()=>requestAnimationFrame(repair));setTimeout(repair,90);setTimeout(repair,260)}};\n new MutationObserver(note).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class','style','aria-hidden','inert']});\n window.addEventListener('pageshow',repair);\n document.addEventListener('pointerup',()=>{if(isLobby())setTimeout(repair,0)},{capture:true});\n document.addEventListener('touchend',()=>{if(isLobby())setTimeout(repair,0)},{capture:true,passive:true});\n note();\n})();\n</script>\n'''
          if marker not in h:
              if '</body>' not in h: raise SystemExit('Missing body anchor')
              p.write_text(h.replace('</body>',patch+'</body>',1),encoding='utf-8')
          PY
      - name: Verify RC401 patch
        run: |
          grep -q 'rc401-mobile-portal-return-stabilization' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
          grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html
      - name: Commit RC401 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC401 already applied'; else git add public/index.html && git commit -m 'RC401 stabilize mobile portal return navigation' && git push origin HEAD:main; fi
