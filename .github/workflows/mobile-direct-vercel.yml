name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC270 mobile portal click authority and media hard stop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC270 MASTER MOBILE PORTAL CLICK AUTHORITY + MEDIA HARD STOP'
          if marker not in html:
              patch=base64.b64decode('').decode('utf-8')
              if html.count('</body>')!=1:
                  raise SystemExit('Expected exactly one </body>; refusing to guess')
              html=html.replace('</body>',patch+'\n</body>',1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC270 and preserve RC268 scroll
        run: |
          grep -q 'RC270 MASTER MOBILE PORTAL CLICK AUTHORITY + MEDIA HARD STOP' public/index.html
          grep -q 'rc270-mobile-portal-click-authority' public/index.html
          grep -q 'Window-capture CLICK only' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'rc268-mobile-native-portal-scroll' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC270 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC270 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC270 master mobile portal click authority and media hard stop"
            git push origin HEAD:main
          fi
