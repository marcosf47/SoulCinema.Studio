name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC409 preserve RC407 and remove RC408
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          h=re.sub(r'<!-- RC408 THEATER NATIVE FULLSCREEN GESTURE -->\s*<script id="rc408-theater-native-fullscreen-gesture">.*?</script>\s*','',h,flags=re.S)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Verify RC409 locked baseline
        run: |
          grep -q 'rc407-isolated-mobile-theater-landscape-player' public/index.html
          grep -q 'rc404-mobile-theater-premiere-reveal' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
          grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html
          ! grep -q 'rc408-theater-native-fullscreen-gesture' public/index.html
      - name: Commit RC409 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC409 already applied'; else git add public/index.html && git commit -m 'RC409 lock RC407 landscape and remove RC408' && git push origin HEAD:main; fi
