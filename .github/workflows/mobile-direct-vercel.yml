name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC290 mobile portal hard media freeze
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- RC290 MOBILE PORTAL HARD MEDIA FREEZE -->'
          if marker in html:
              raise SystemExit('RC290 already present unexpectedly')
          anchor='\n<!-- RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP -->'
          if html.count(anchor)!=1:
              raise SystemExit(f'RC271 anchor count={html.count(anchor)}; refusing to guess')

          rc290=r'''
<!-- RC290 MOBILE PORTAL HARD MEDIA FREEZE -->
<style id="rc290-mobile-portal-hard-freeze-css">
@media(max-width:700px){
  #lobby.portal-mode #lobbyVideo{display:none!important;}
}
</style>
<script id="rc290-mobile-portal-hard-freeze">
(()=>{
  'use strict';
  const mobile=()=>matchMedia('(max-width:700px)').matches;
  if(!mobile())return;
  const lobby=document.getElementById('lobby');
  const portals=document.getElementById('portals');
  const skip=document.getElementById('skip');
  const video=document.getElementById('lobbyVideo');
  const source=video?.querySelector('source');
  const ambient=document.getElementById('ambient');
  if(!lobby||!portals||!skip||!video||!source)return;

  const originalSrc=source.getAttribute('src')||'';
  let detached=false;

  const freeze=()=>{
    if(!mobile())return;
    document.body.dataset.mobilePortalLock='1';
    try{video.pause()}catch(_e){}
    try{ambient?.pause()}catch(_e){}
    if(!detached){
      detached=true;
      video.dataset.rc290Src=originalSrc;
      source.removeAttribute('src');
      try{video.removeAttribute('src')}catch(_e){}
      try{video.load()}catch(_e){}
    }
  };

  const restore=()=>{
    if(!mobile()||!detached)return;
    if(document.body.dataset.mobilePortalLock==='1'&&!document.getElementById('gate')?.classList.contains('active'))return;
    source.setAttribute('src',video.dataset.rc290Src||originalSrc);
    try{video.load()}catch(_e){}
    detached=false;
  };

  const portalActive=()=>lobby.classList.contains('portal-mode')||portals.classList.contains('show');
  const sync=()=>{if(portalActive())freeze();};

  window.addEventListener('pointerdown',e=>{
    if(!mobile())return;
    if(e.target?.closest?.('#skip'))freeze();
  },true);
  window.addEventListener('touchstart',e=>{
    if(!mobile())return;
    if(e.target?.closest?.('#skip'))freeze();
  },{capture:true,passive:true});

  new MutationObserver(sync).observe(lobby,{attributes:true,attributeFilter:['class']});
  new MutationObserver(sync).observe(portals,{attributes:true,attributeFilter:['class']});

  const gate=document.getElementById('gate');
  if(gate)new MutationObserver(()=>{
    if(gate.classList.contains('active')){
      delete document.body.dataset.mobilePortalLock;
      restore();
    }
  }).observe(gate,{attributes:true,attributeFilter:['class']});

  document.addEventListener('play',e=>{
    if(!portalActive())return;
    const m=e.target;
    if(m===video||m===ambient){try{m.pause()}catch(_e){}}
  },true);

  sync();
})();
</script>
'''
          html=html.replace(anchor,rc290+anchor,1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC290 and locked layers
        run: |
          grep -q 'RC290 MOBILE PORTAL HARD MEDIA FREEZE' public/index.html
          grep -q 'rc290-mobile-portal-hard-freeze' public/index.html
          grep -q "source.removeAttribute('src')" public/index.html
          grep -q 'RC289 MOBILE PORTAL SINGLE OWNER + QUIET MEDIA' public/index.html
          grep -q 'RC269 MASTER MOBILE MEDIA AUTHORITY LOCK' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html
          grep -q 'RC288 CONTACT IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC288 CONTACT OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC287 OFFICIAL SOULCINEMA CONTACT INBOX' public/index.html
          grep -q 'RC286 ABOUT US IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC286 ABOUT US OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC285 VISUAL BIBLE OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC284 JOURNAL IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC284 JOURNAL OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC283 STORY ROOM IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC283 STORY ROOM OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC282 PRODUCTION ROOM RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC281 SCREENING THEATER RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC280 LIVE SAFE NATIVE RATIO FILL' public/index.html
          grep -q 'RC277 DESKTOP LIVE CENTER RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC276 LIVE AUTOPLAY BROADCAST ONLY PLAYER' public/index.html

      - name: Commit RC290 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC290 already applied"
          else
            git add public/index.html
            git commit -m "RC290 hard-freeze mobile lobby media in portal mode"
            git push origin HEAD:main
          fi
