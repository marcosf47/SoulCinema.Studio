name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC297 desktop Production Room viewport fit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT -->'
          anchor='\n<!-- RC296 MOBILE LOBBY LAYOUT REGRESSION ROLLBACK -->'
          if marker not in html:
              if html.count(anchor)!=1:
                  raise SystemExit(f'RC296 anchor count={html.count(anchor)}; refusing to guess')
              payload=''
              patch=base64.b64decode(payload).decode('utf-8')
              html=html.replace(anchor,'\n'+patch+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC297 and preserve locks
        run: |
          grep -q 'RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT' public/index.html
          grep -q 'RC296 MOBILE LOBBY LAYOUT REGRESSION ROLLBACK' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'RC292 MOBILE PORTAL THEATER GHOST PLAY GUARD' public/index.html
          grep -q 'RC291 MOBILE PORTAL AMBIENT HARD FREEZE' public/index.html
          grep -q 'RC290 MOBILE PORTAL HARD MEDIA FREEZE' public/index.html
          grep -q 'RC289 MOBILE PORTAL SINGLE OWNER + QUIET MEDIA' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html
          grep -q 'RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP' public/index.html

      - name: Commit RC297 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC297 already applied"
          else
            git add public/index.html
            git commit -m "RC297 desktop Production Room viewport fit"
            git push origin HEAD:main
          fi
