name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply desktop Live Center exit media stop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP'
          if marker not in html:
              patch='''\n<!-- RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP -->\n<script id="rc271-desktop-live-exit-media-stop">\n(()=>{\n  'use strict';\n  const desktop=()=>matchMedia('(min-width:701px)').matches;\n  const live=()=>document.getElementById('liveCenter');\n  const player=()=>document.getElementById('livePlayer');\n  const stopLive=()=>{\n    if(!desktop())return;\n    const v=player();\n    if(v){try{v.pause()}catch(_e){}}\n  };\n  const room=live();\n  if(!room)return;\n  new MutationObserver(()=>{\n    if(!room.classList.contains('active'))stopLive();\n  }).observe(room,{attributes:true,attributeFilter:['class']});\n  const returnBtn=document.getElementById('returnLobby');\n  if(returnBtn)returnBtn.addEventListener('click',stopLive,true);\n  document.addEventListener('visibilitychange',()=>{\n    if(!room.classList.contains('active'))stopLive();\n  });\n})();\n</script>\n'''
              if html.count('</body>')!=1:
                  raise SystemExit('Expected exactly one </body>; refusing to guess')
              html=html.replace('</body>',patch+'\n</body>',1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify desktop-only fix and preserve mobile baseline
        run: |
          grep -q 'RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP' public/index.html
          grep -q 'rc271-desktop-live-exit-media-stop' public/index.html
          grep -q "min-width:701px" public/index.html
          grep -q 'RC269 MASTER MOBILE MEDIA AUTHORITY LOCK' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock desktop Live exit fix into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC271 already locked"
          else
            git config user.name "SoulCinema Direct Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC271 desktop Live Center exit media stop"
            git push origin HEAD:main
          fi
