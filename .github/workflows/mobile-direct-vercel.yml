name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC268 master mobile portal runtime cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP'
          if marker not in html:
              def remove_script_by_id(doc, sid):
                  start=f'<script id="{sid}">'
                  c=doc.count(start)
                  if c not in (0,1):
                      raise SystemExit(f'Unexpected {sid} count {c}; refusing to guess')
                  if c==1:
                      s=doc.index(start)
                      e=doc.index('</script>',s)+len('</script>')
                      doc=doc[:s]+doc[e:]
                  return doc

              # Remove stacked portal touch owners that fight native scrolling.
              for sid in [
                  'rc242-mobile-scroll-tap-guard',
                  'rc243-mobile-arrow-only-open',
                  'rc249-mobile-real-arrow-buttons',
                  'rc266-mobile-portal-native-owner',
                  'rc267-mobile-portal-runtime-lock',
              ]:
                  html=remove_script_by_id(html,sid)

              # Remove one additional anonymous legacy portal touch owner by its unique fingerprint.
              fp='let sx=0,sy=0,moved=false,activePortal=null;'
              c=html.count(fp)
              if c not in (0,1):
                  raise SystemExit(f'Unexpected activePortal legacy owner count {c}; refusing to guess')
              if c==1:
                  pos=html.index(fp)
                  s=html.rfind('<script',0,pos)
                  e=html.index('</script>',pos)+len('</script>')
                  if s<0:
                      raise SystemExit('Could not resolve activePortal script start; refusing to guess')
                  html=html[:s]+html[e:]

              # Remove old coordinate-capture pointerdown routes that steal vertical swipes.
              blocks=[
"""document.addEventListener('pointerdown',(e)=>{
 if(!productionPortalVisualHit(e))return;
 e.preventDefault();
 e.stopImmediatePropagation();
 openProductionHard();
},{capture:true});""",
"""document.addEventListener('pointerdown',(e)=>{
 if(!visualBiblePortalVisualHit(e))return;
 e.preventDefault();e.stopImmediatePropagation();
 visualBiblePortalBtn.classList.add('rc-pressed');
 setTimeout(()=>visualBiblePortalBtn.classList.remove('rc-pressed'),260);
 openBibleHard();
},{capture:true});""",
              ]
              for block in blocks:
                  c=html.count(block)
                  if c not in (0,1):
                      raise SystemExit(f'Unexpected coordinate block count {c}; refusing to guess')
                  if c==1:
                      html=html.replace(block,'',1)

              # Strengthen the real sequence engine guard instead of stacking another playback handler.
              old="function sequence(preserveLobbyPlayback=false){if(matchMedia('(max-width:700px)').matches&&lobby.classList.contains('portal-mode'))return;clearTimers();"
              new="function sequence(preserveLobbyPlayback=false){if(matchMedia('(max-width:700px)').matches&&(lobby.classList.contains('portal-mode')||portals.classList.contains('show')||document.body?.dataset.mobilePortalLock==='1'))return;clearTimers();"
              if html.count(old)!=1:
                  raise SystemExit(f'Expected exactly one RC267 sequence guard, found {html.count(old)}; refusing to guess')
              html=html.replace(old,new,1)

              # Upgrade showPortals itself: portal mode is a hard quiet state on mobile.
              anchor="   try{lobbyVideo.pause()}catch(_e){}\n   lobby.classList.add('portal-mode');"
              replacement="   try{lobbyVideo.pause()}catch(_e){}\n   try{ambient.pause()}catch(_e){}\n   lobby.querySelectorAll('video,audio').forEach(m=>{try{m.pause()}catch(_e){}});\n   if(document.body)document.body.dataset.mobilePortalLock='1';\n   lobby.classList.add('portal-mode');"
              if html.count(anchor)!=1:
                  raise SystemExit(f'Expected exactly one mobile showPortals pause anchor, found {html.count(anchor)}; refusing to guess')
              html=html.replace(anchor,replacement,1)

              patch=r'''
<!-- RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP -->
<script id="rc268-mobile-portal-runtime-clean-owner">
(()=>{
  'use strict';
  const mobile=()=>matchMedia('(max-width:700px)').matches;
  const lobby=()=>document.getElementById('lobby');
  const portals=()=>document.getElementById('portals');
  const gate=()=>document.getElementById('gate');
  const stopLobbyMedia=()=>{
    if(!mobile())return;
    document.querySelectorAll('#lobby video,#lobby audio').forEach(m=>{try{m.pause()}catch(_e){}});
    const lv=document.getElementById('lobbyVideo'); try{lv?.pause()}catch(_e){}
    const amb=document.getElementById('ambient'); try{amb?.pause()}catch(_e){}
  };
  const portalOn=()=>!!(mobile()&&lobby()?.classList.contains('portal-mode')&&portals()?.classList.contains('show'));
  const sync=()=>{
    if(!mobile())return;
    if(portalOn()){
      document.body.dataset.mobilePortalLock='1';
      stopLobbyMedia();
    }else if(gate()?.classList.contains('active')){
      delete document.body.dataset.mobilePortalLock;
    }
  };
  const ready=()=>{
    const l=lobby(),p=portals(),g=gate();
    if(!l||!p||!g)return;
    sync();
    new MutationObserver(sync).observe(l,{attributes:true,attributeFilter:['class']});
    new MutationObserver(sync).observe(p,{attributes:true,attributeFilter:['class']});
    new MutationObserver(sync).observe(g,{attributes:true,attributeFilter:['class']});
    // Passive intent guard only: never prevent or stop touch/pointer scrolling.
    p.addEventListener('pointerdown',e=>{
      if(!portalOn())return;
      if(e.target?.closest?.('[data-room],.studio-utility-btn')){
        document.body.dataset.mobilePortalLock='1';
        stopLobbyMedia();
      }
    },{passive:true});
    p.addEventListener('click',e=>{
      if(!portalOn())return;
      if(e.target?.closest?.('[data-room],.studio-utility-btn')){
        document.body.dataset.mobilePortalLock='1';
        stopLobbyMedia();
      }
    },true);
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready,{once:true});else ready();
})();
</script>
<style id="rc268-mobile-native-portal-scroll">
@media(max-width:700px){
  #lobby.portal-mode #portals{
    overflow-y:auto!important;
    overflow-x:hidden!important;
    touch-action:pan-y!important;
    overscroll-behavior-y:contain!important;
    -webkit-overflow-scrolling:touch!important;
    scroll-snap-type:none!important;
  }
  #lobby.portal-mode #portals .portal-shell,
  #lobby.portal-mode #portals .portal,
  #lobby.portal-mode #portals .studio-utility-nav,
  #lobby.portal-mode #portals .studio-utility-btn{
    touch-action:pan-y!important;
    scroll-snap-align:none!important;
  }
  #lobby.portal-mode #portals .portal-shell{
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
  }
}
</style>
'''
              if html.count('</body>')!=1:
                  raise SystemExit('Expected one </body>; refusing to guess')
              html=html.replace('</body>',patch+'\n</body>',1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC268
        run: |
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'rc268-mobile-portal-runtime-clean-owner' public/index.html
          grep -q 'rc268-mobile-native-portal-scroll' public/index.html
          grep -q "document.body?.dataset.mobilePortalLock==='1'" public/index.html
          grep -q "document.body.dataset.mobilePortalLock='1'" public/index.html
          if grep -q 'rc242-mobile-scroll-tap-guard' public/index.html; then exit 1; fi
          if grep -q 'rc243-mobile-arrow-only-open' public/index.html; then exit 1; fi
          if grep -q 'rc249-mobile-real-arrow-buttons' public/index.html; then exit 1; fi
          if grep -q 'rc266-mobile-portal-native-owner' public/index.html; then exit 1; fi
          if grep -q 'rc267-mobile-portal-runtime-lock' public/index.html; then exit 1; fi
          if grep -q 'let sx=0,sy=0,moved=false,activePortal=null;' public/index.html; then exit 1; fi
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC268 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC268 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC268 master mobile portal runtime cleanup"
            git push origin HEAD:main
          fi
