name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC285 Visual Bible OUT single cinematic handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          old="function returnFromBible(){journeyTransition('THE GRAND LOBBY','RETURNING','CHOOSE YOUR NEXT CHAPTER',()=>{SceneManager.goTo('lobby');scene(visualBibleRoom,lobby);setTimeout(showPortals,520)})}"
          new="function returnFromBible(){journeyTransition('THE GRAND LOBBY','RETURNING','CHOOSE YOUR NEXT CHAPTER',()=>{/* RC285 VISUAL BIBLE OUT — SINGLE CINEMATIC HANDOFF */SceneManager.goTo('lobby');visualBibleRoom.classList.remove('active');lobby.classList.add('active');transitionCount++;updateRuntimeMonitor();setTimeout(showPortals,420)})}"
          if html.count(old)!=1:
              raise SystemExit(f'Expected exact Visual Bible OUT target once; found {html.count(old)}; refusing to guess')
          html=html.replace(old,new,1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC285 and preserve locked layers
        run: |
          grep -q 'RC285 VISUAL BIBLE OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          if grep -q "SceneManager.goTo('lobby');scene(visualBibleRoom,lobby)" public/index.html; then echo 'Old Visual Bible OUT nested scene remains'; exit 1; fi
          grep -q "function openBible(){clearTimers();visualBibleRoom.classList.add('bible-arriving')" public/index.html
          grep -q 'RC284 JOURNAL IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC284 JOURNAL OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC283 STORY ROOM IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC283 STORY ROOM OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC282 PRODUCTION ROOM RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC281 SCREENING THEATER RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC280 LIVE SAFE NATIVE RATIO FILL' public/index.html
          grep -q 'RC277 DESKTOP LIVE CENTER RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC276 LIVE AUTOPLAY BROADCAST ONLY PLAYER' public/index.html
          grep -q 'RC269 MASTER MOBILE MEDIA AUTHORITY LOCK' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC285 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC285 already locked"
          else
            git config user.name "SoulCinema Direct Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC285 smooth Visual Bible return transition"
            git push origin HEAD:main
          fi
