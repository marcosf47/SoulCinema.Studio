name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC413B mobile portal reconstruction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          h=re.sub(r'<!-- RC412B DIRECT MOBILE PORTAL ROUTER -->.*?</script>\s*','',h,flags=re.S)
          old='      bind(n,()=>openRoom(room,n));'
          if old not in h:
              raise SystemExit('portal bind not found')
          h=h.replace(old,'      // RC413B single authority: portal cards are routed only by RC342 capture router.',1)
          start=h.find('  const findAction=(e)=>{')
          end=h.find('  const rememberTap=(e)=>{',start)
          if start<0 or end<0:
              raise SystemExit('findAction block not found')
          new_find="""  const findAction=(e)=>{
    if(!mobile())return;
    const portalSelector='#portals .portal[data-room],#portals .portal[data-mobile-room],#portals .studio-utility-btn[data-room]';
    const hit=e.target?.closest?.(portalSelector+',button,[role=button]');
    if(!hit)return;
    const id=hit.id||'';
    const room=hit.dataset?.mobileRoom||hit.dataset?.room;
    const returns=new Set(['theaterReturn','musicReturn','returnLobby','productionReturn','storyReturn','journalReturn','bibleReturn','aboutReturn','contactReturn']);
    let action=null;
    if(id==='enter'||id==='preview')action=goEnter;
    else if(id==='back')action=goGate;
    else if(id==='skip')action=goPortals;
    else if(returns.has(id))action=goPortals;
    else if(room&&hit.closest?.('#portals'))action=()=>openRoom(room,hit);
    if(!action)return;
    return {action,hit};
  };
"""
          h=h[:start]+new_find+h[end:]
          needle="""    if((e.type==='pointerup'||e.type==='touchend')&&tapStart){
      const p=eventPoint(e);
      const dx=Math.abs(p.x-tapStart.x);
      const dy=Math.abs(p.y-tapStart.y);
      if(dx>32||dy>32)return;
    }"""
          repl="""    if((e.type==='pointerup'||e.type==='touchend')&&tapStart){
      const p=eventPoint(e);
      const dx=Math.abs(p.x-tapStart.x);
      const dy=Math.abs(p.y-tapStart.y);
      if(dx>32||dy>32||tapStart.hit!==routed.hit){tapStart=null;return;}
    }"""
          if needle not in h:
              raise SystemExit('gesture block not found')
          h=h.replace(needle,repl,1)
          old_open="""    if(document.body.dataset.experience==='portal_mode'&&document.body.dataset.rc375RoomOpening!=='1'){
      document.body.dataset.rc375RoomOpening='1';
      source?.classList?.add('rc375-portal-pressed');
      setTimeout(()=>{
        source?.classList?.remove('rc375-portal-pressed');
        delete document.body.dataset.rc375RoomOpening;
        openRoom(room);
      },145);
      return;
    }"""
          new_open="""    if(document.body.dataset.experience==='portal_mode'){
      source?.classList?.add('rc375-portal-pressed');
      requestAnimationFrame(()=>source?.classList?.remove('rc375-portal-pressed'));
    }"""
          if old_open not in h:
              raise SystemExit('delayed openRoom block not found')
          h=h.replace(old_open,new_open,1)
          anchor='<!-- RC375 MOBILE PORTAL SCROLL + ROOM HANDOFF SMOOTHNESS -->'
          marker='<!-- RC413B MOBILE PORTALS SINGLE NAVIGATION AUTHORITY -->\n'
          if anchor not in h:
              raise SystemExit('RC375 anchor not found')
          if marker.strip() not in h:
              h=h.replace(anchor,marker+anchor,1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Verify RC413B
        run: |
          grep -q 'RC413B MOBILE PORTALS SINGLE NAVIGATION AUTHORITY' public/index.html
          grep -q 'RC413B single authority' public/index.html
          grep -q 'tapStart.hit!==routed.hit' public/index.html
          ! grep -q 'rc412b-direct-mobile-portal-router' public/index.html
          grep -q 'rc404-mobile-theater-premiere-reveal' public/index.html
          grep -q 'rc407-isolated-mobile-theater-landscape-player' public/index.html
          grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html
          ! grep -q 'rc408-theater-native-fullscreen-gesture' public/index.html
      - name: Commit RC413B source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC413B already applied'; else git add public/index.html && git commit -m 'RC413B single mobile portal navigation authority' && git push origin HEAD:main; fi
