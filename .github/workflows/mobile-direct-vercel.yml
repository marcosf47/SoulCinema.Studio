name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Roll back RC270 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          sid='<script id="rc270-mobile-portal-click-authority">'
          if sid in html:
              s=html.index('<!-- RC270 MASTER MOBILE PORTAL CLICK AUTHORITY + MEDIA HARD STOP -->')
              e=html.index('</script>', html.index(sid, s))+len('</script>')
              html=html[:s]+html[e:]
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify rollback and preserve locked fixes
        run: |
          ! grep -q 'RC270 MASTER MOBILE PORTAL CLICK AUTHORITY + MEDIA HARD STOP' public/index.html
          grep -q 'RC269 MASTER MOBILE MEDIA AUTHORITY LOCK' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock rollback into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC270 already absent"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "Rollback RC270 restore RC268 scroll baseline"
            git push origin HEAD:main
          fi
