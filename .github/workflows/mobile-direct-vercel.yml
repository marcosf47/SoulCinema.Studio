name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC294 mobile Skip soft full-hitbox owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- RC294 MOBILE SKIP SOFT FULL HITBOX OWNER -->'
          if marker not in html:
              anchor='\n<!-- RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER -->'
              if html.count(anchor)!=1:
                  raise SystemExit(f'RC293 anchor count={html.count(anchor)}; refusing to guess')
              patch=r'''
<!-- RC294 MOBILE SKIP SOFT FULL HITBOX OWNER -->
<style id="rc294-mobile-skip-soft-hitbox-css">
@media(max-width:700px){
  #lobby #skip{
    position:relative!important;
    z-index:1200!important;
    pointer-events:auto!important;
    touch-action:manipulation!important;
    -webkit-tap-highlight-color:transparent!important;
  }
  #lobby #skip::before{
    content:"";
    position:absolute;
    inset:-14px -20px;
    border-radius:999px;
    pointer-events:auto;
  }
}
</style>
<script id="rc294-mobile-skip-soft-hitbox-owner">
(()=>{
  'use strict';
  const mobile=()=>matchMedia('(max-width:700px)').matches;
  if(!mobile())return;
  const skip=document.getElementById('skip');
  const lobby=document.getElementById('lobby');
  const portals=document.getElementById('portals');
  if(!skip||!lobby||!portals)return;

  let busy=false;
  const insideExpandedSkip=(e)=>{
    if(!e)return false;
    const r=skip.getBoundingClientRect();
    const x=e.clientX ?? e.touches?.[0]?.clientX;
    const y=e.clientY ?? e.touches?.[0]?.clientY;
    if(!Number.isFinite(x)||!Number.isFinite(y))return false;
    return x>=r.left-20 && x<=r.right+20 && y>=r.top-14 && y<=r.bottom+14;
  };
  const stopMedia=()=>{
    document.body.dataset.mobilePortalLock='1';
    document.querySelectorAll('#lobby video,#lobby audio,#ambient').forEach(m=>{
      if(!(m instanceof HTMLMediaElement))return;
      try{m.pause()}catch(_e){}
    });
  };
  const openPortalsNow=(e)=>{
    if(!mobile()||busy||skip.style.display==='none')return;
    if(!insideExpandedSkip(e))return;
    busy=true;
    if(e.cancelable)e.preventDefault();
    e.stopImmediatePropagation?.();
    try{if(typeof clearTimers==='function')clearTimers()}catch(_e){}
    stopMedia();
    document.getElementById('heart')?.classList.remove('show');
    document.getElementById('premiereCard')?.classList.remove('show');
    document.getElementById('fade')?.classList.remove('on');
    const journey=document.getElementById('journeyTransition');
    if(journey){journey.classList.remove('on');journey.setAttribute('aria-hidden','true');}
    lobby.classList.add('active','portal-mode');
    portals.classList.add('show');
    skip.style.display='none';
    document.body.dataset.scene='lobby';
    document.body.dataset.experience='portal_mode';
    stopMedia();
    requestAnimationFrame(()=>{stopMedia();busy=false;});
  };

  window.addEventListener('pointerdown',openPortalsNow,true);
  window.addEventListener('touchstart',openPortalsNow,{capture:true,passive:false});
})();
</script>
'''
              payload=base64.b64encode(patch.encode()).decode()
              patch=base64.b64decode(payload).decode('utf-8')
              html=html.replace(anchor,'\n'+patch+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC294 and preserve current locks
        run: |
          grep -q 'RC294 MOBILE SKIP SOFT FULL HITBOX OWNER' public/index.html
          grep -q 'rc294-mobile-skip-soft-hitbox-owner' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'RC292 MOBILE PORTAL THEATER GHOST PLAY GUARD' public/index.html
          grep -q 'RC291 MOBILE PORTAL AMBIENT HARD FREEZE' public/index.html
          grep -q 'RC290 MOBILE PORTAL HARD MEDIA FREEZE' public/index.html
          grep -q 'RC289 MOBILE PORTAL SINGLE OWNER + QUIET MEDIA' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html
          grep -q 'RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP' public/index.html

      - name: Commit RC294 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC294 already applied"
          else
            git add public/index.html
            git commit -m "RC294 mobile Skip soft full hitbox owner"
            git push origin HEAD:main
          fi
