name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC286 About Us single cinematic handoffs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          old_open="function openAbout(){clearTimers();journeyTransition('ABOUT US','THE STUDIO','WHY SOULCINEMA EXISTS',()=>{SceneManager.goTo('about');scene(lobby,aboutRoom)})}"
          new_open="function openAbout(){clearTimers();journeyTransition('ABOUT US','THE STUDIO','WHY SOULCINEMA EXISTS',()=>{/* RC286 ABOUT US IN — SINGLE CINEMATIC HANDOFF */SceneManager.goTo('about');lobby.classList.remove('active');aboutRoom.classList.add('active');transitionCount++;updateRuntimeMonitor()})}"
          old_return="function returnFromAbout(){journeyTransition('THE GRAND LOBBY','RETURNING','CHOOSE YOUR NEXT CHAPTER',()=>{SceneManager.goTo('lobby');scene(aboutRoom,lobby);setTimeout(showPortals,520)})}"
          new_return="function returnFromAbout(){journeyTransition('THE GRAND LOBBY','RETURNING','CHOOSE YOUR NEXT CHAPTER',()=>{/* RC286 ABOUT US OUT — SINGLE CINEMATIC HANDOFF */SceneManager.goTo('lobby');aboutRoom.classList.remove('active');lobby.classList.add('active');transitionCount++;updateRuntimeMonitor();setTimeout(showPortals,420)})}"
          if html.count(old_open)!=1 or html.count(old_return)!=1:
              raise SystemExit(f'Expected exact About Us targets once each; open={html.count(old_open)} return={html.count(old_return)}; refusing to guess')
          html=html.replace(old_open,new_open,1).replace(old_return,new_return,1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC286 and preserve locked layers
        run: |
          grep -q 'RC286 ABOUT US IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC286 ABOUT US OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          if grep -q "SceneManager.goTo('about');scene(lobby,aboutRoom)" public/index.html; then echo 'Old About IN nested scene remains'; exit 1; fi
          if grep -q "SceneManager.goTo('lobby');scene(aboutRoom,lobby)" public/index.html; then echo 'Old About OUT nested scene remains'; exit 1; fi
          grep -q 'RC285 VISUAL BIBLE OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC284 JOURNAL IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC284 JOURNAL OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC283 STORY ROOM IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC283 STORY ROOM OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC282 PRODUCTION ROOM RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC281 SCREENING THEATER RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC280 LIVE SAFE NATIVE RATIO FILL' public/index.html
          grep -q 'RC277 DESKTOP LIVE CENTER RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC276 LIVE AUTOPLAY BROADCAST ONLY PLAYER' public/index.html
          grep -q 'RC269 MASTER MOBILE MEDIA AUTHORITY LOCK' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC286 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC286 already locked"
          else
            git config user.name "SoulCinema Direct Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC286 smooth About Us in and out transitions"
            git push origin HEAD:main
          fi
