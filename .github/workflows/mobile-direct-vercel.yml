name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC268 master mobile portal runtime cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP'
          if marker not in html:
              def remove_script_by_id(doc,sid):
                  start=f'<script id="{sid}">'
                  c=doc.count(start)
                  if c not in (0,1):
                      raise SystemExit(f'Unexpected {sid} count {c}; refusing to guess')
                  if c==1:
                      s=doc.index(start)
                      e=doc.index('</script>',s)+len('</script>')
                      doc=doc[:s]+doc[e:]
                  return doc
              for sid in ['rc242-mobile-scroll-tap-guard','rc243-mobile-arrow-only-open','rc249-mobile-real-arrow-buttons','rc266-mobile-portal-native-owner','rc267-mobile-portal-runtime-lock']:
                  html=remove_script_by_id(html,sid)
              fp='let sx=0,sy=0,moved=false,activePortal=null;'
              c=html.count(fp)
              if c not in (0,1):
                  raise SystemExit(f'Unexpected activePortal legacy owner count {c}; refusing to guess')
              if c==1:
                  pos=html.index(fp)
                  s=html.rfind('<script',0,pos)
                  e=html.index('</script>',pos)+len('</script>')
                  if s<0:
                      raise SystemExit('Could not resolve activePortal script start; refusing to guess')
                  html=html[:s]+html[e:]
              for enc in ['ZG9jdW1lbnQuYWRkRXZlbnRMaXN0ZW5lcigncG9pbnRlcmRvd24nLChlKT0+ewogaWYoIXByb2R1Y3Rpb25Qb3J0YWxWaXN1YWxIaXQoZSkpcmV0dXJuOwogZS5wcmV2ZW50RGVmYXVsdCgpOwogZS5zdG9wSW1tZWRpYXRlUHJvcGFnYXRpb24oKTsKIG9wZW5Qcm9kdWN0aW9uSGFyZCgpOwp9LHtjYXB0dXJlOnRydWV9KTs=','']:
                  block=base64.b64decode(enc).decode('utf-8')
                  c=html.count(block)
                  if c not in (0,1):
                      raise SystemExit(f'Unexpected coordinate block count {c}; refusing to guess')
                  if c==1:
                      html=html.replace(block,'',1)
              old="function sequence(preserveLobbyPlayback=false){if(matchMedia('(max-width:700px)').matches&&lobby.classList.contains('portal-mode'))return;clearTimers();"
              new="function sequence(preserveLobbyPlayback=false){if(matchMedia('(max-width:700px)').matches&&(lobby.classList.contains('portal-mode')||portals.classList.contains('show')||document.body?.dataset.mobilePortalLock==='1'))return;clearTimers();"
              if html.count(old)!=1:
                  raise SystemExit(f'Expected exactly one RC267 sequence guard, found {html.count(old)}; refusing to guess')
              html=html.replace(old,new,1)
              anchor="   try{lobbyVideo.pause()}catch(_e){}\n   lobby.classList.add('portal-mode');"
              replacement="   try{lobbyVideo.pause()}catch(_e){}\n   try{ambient.pause()}catch(_e){}\n   lobby.querySelectorAll('video,audio').forEach(m=>{try{m.pause()}catch(_e){}});\n   if(document.body)document.body.dataset.mobilePortalLock='1';\n   lobby.classList.add('portal-mode');"
              if html.count(anchor)!=1:
                  raise SystemExit(f'Expected exactly one mobile showPortals pause anchor, found {html.count(anchor)}; refusing to guess')
              html=html.replace(anchor,replacement,1)
              patch=base64.b64decode('').decode('utf-8')
              if html.count('</body>')!=1:
                  raise SystemExit('Expected one </body>; refusing to guess')
              html=html.replace('</body>',patch+'\n</body>',1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC268
        run: |
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'rc268-mobile-portal-runtime-clean-owner' public/index.html
          grep -q 'rc268-mobile-native-portal-scroll' public/index.html
          grep -q "document.body?.dataset.mobilePortalLock==='1'" public/index.html
          grep -q "document.body.dataset.mobilePortalLock='1'" public/index.html
          if grep -q '<script id="rc242-mobile-scroll-tap-guard">' public/index.html; then exit 1; fi
          if grep -q '<script id="rc243-mobile-arrow-only-open">' public/index.html; then exit 1; fi
          if grep -q '<script id="rc249-mobile-real-arrow-buttons">' public/index.html; then exit 1; fi
          if grep -q '<script id="rc266-mobile-portal-native-owner">' public/index.html; then exit 1; fi
          if grep -q '<script id="rc267-mobile-portal-runtime-lock">' public/index.html; then exit 1; fi
          if grep -q 'let sx=0,sy=0,moved=false,activePortal=null;' public/index.html; then exit 1; fi
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC268 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC268 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC268 master mobile portal runtime cleanup"
            git push origin HEAD:main
          fi
