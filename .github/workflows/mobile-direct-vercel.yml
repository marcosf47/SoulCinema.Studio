name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC277 clean Live Center return handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='// RC277 DESKTOP LIVE CENTER RETURN — SINGLE CINEMATIC HANDOFF'
          if marker not in html:
              old="bind('#returnLobby',()=>{if(liveCountdownTimer){clearInterval(liveCountdownTimer);liveCountdownTimer=null}const liveEl=$('#liveCenter'),lobbyEl=$('#lobby');journeyTransition('THE GRAND LOBBY','RETURNING','CHOOSE YOUR NEXT CHAPTER',()=>{SceneManager.goTo('lobby');scene(liveEl,lobbyEl);setTimeout(showPortals,520)})});"
              new=marker+"\n"+"bind('#returnLobby',()=>{if(liveCountdownTimer){clearInterval(liveCountdownTimer);liveCountdownTimer=null}const liveEl=$('#liveCenter'),lobbyEl=$('#lobby');journeyTransition('THE GRAND LOBBY','RETURNING','CHOOSE YOUR NEXT CHAPTER',()=>{SceneManager.goTo('lobby');document.body.dataset.liveMode='standby';liveEl.classList.remove('active');lobbyEl.classList.add('active');showPortals();updateRuntimeMonitor()})});"
              if html.count(old)!=1:
                  raise SystemExit(f'Expected exactly one Live return binding, found {html.count(old)}; refusing to guess')
              html=html.replace(old,new,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC277 and preserve locked layers
        run: |
          grep -q 'RC277 DESKTOP LIVE CENTER RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC276 LIVE AUTOPLAY BROADCAST ONLY PLAYER' public/index.html
          grep -q 'RC275 SOULCINEMA LIVE CENTER VPS EMBED RECOVERY' public/index.html
          grep -q 'RC272 DESKTOP LIVE TRUTH STATE + STALE CLIP GUARD' public/index.html
          grep -q 'RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP' public/index.html
          grep -q 'RC269 MASTER MOBILE MEDIA AUTHORITY LOCK' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html
          if grep -q "scene(liveEl,lobbyEl)" public/index.html; then
            echo 'Nested Live return scene transition still present'; exit 1
          fi

      - name: Lock RC277 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC277 already locked"
          else
            git config user.name "SoulCinema Direct Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC277 clean Live Center to Grand Lobby handoff"
            git push origin HEAD:main
          fi
