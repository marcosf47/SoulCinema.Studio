name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC276 Live autoplay broadcast-only behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC276 LIVE AUTOPLAY BROADCAST ONLY PLAYER'
          if marker not in html:
              patch='''
<!-- RC276 LIVE AUTOPLAY BROADCAST ONLY PLAYER -->
<style id="rc276-live-autoplay-css">
#liveCenter #rc275LiveFrame{pointer-events:none!important;}
</style>
<script id="rc276-live-autoplay">
(()=>{
  'use strict';
  const room=document.getElementById('liveCenter');
  const frame=document.getElementById('rc275LiveFrame');
  if(!room||!frame)return;
  const LIVE='https://live.soulcinema.studio/soulcinemad/?controls=false&muted=true&autoplay=true&playsInline=true';
  const start=()=>{
    if(!room.classList.contains('active'))return;
    if(frame.getAttribute('src')!==LIVE) frame.setAttribute('src',LIVE);
  };
  new MutationObserver(start).observe(room,{attributes:true,attributeFilter:['class']});
  start();
})();
</script>
'''
              if html.count('</body>')!=1:
                  raise SystemExit('Expected exactly one </body>; refusing to guess')
              html=html.replace('</body>',patch+'\n</body>',1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC276 and preserve locked layers
        run: |
          grep -q 'RC276 LIVE AUTOPLAY BROADCAST ONLY PLAYER' public/index.html
          grep -q 'RC275 SOULCINEMA LIVE CENTER VPS EMBED RECOVERY' public/index.html
          grep -q 'controls=false&muted=true&autoplay=true' public/index.html
          grep -q 'RC272 DESKTOP LIVE TRUTH STATE + STALE CLIP GUARD' public/index.html
          grep -q 'RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP' public/index.html
          grep -q 'RC269 MASTER MOBILE MEDIA AUTHORITY LOCK' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC276 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC276 already locked"
          else
            git config user.name "SoulCinema Direct Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC276 live autoplay broadcast-only player behavior"
            git push origin HEAD:main
          fi
