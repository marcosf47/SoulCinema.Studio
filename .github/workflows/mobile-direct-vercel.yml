name: SoulCinema Direct Vercel
on:
  push:
    branches: [main]
    paths: [.github/workflows/mobile-direct-vercel.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC432
        run: python3 .github/scripts/rc432.py
      - name: Verify RC432
        run: grep -q 'RC432 DIRECT MOBILE LIVE FULLSCREEN' public/index.html && grep -q 'rc432LiveFullscreen' public/index.html && ! grep -q 'rc431-mobile-live-iframe-fullscreen-permission' public/index.html && grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html && grep -q 'RC418 THEATER FULLSCREEN EXIT ISOLATION' public/index.html && grep -q 'RC417 NATIVE THEATER FULLSCREEN ONLY' public/index.html
      - name: Commit source
        run: git config user.name 'SoulCinema Direct Deploy' && git config user.email 'actions@users.noreply.github.com' && git add public/index.html && git commit -m 'RC432 direct mobile Live fullscreen control' && git push origin HEAD:main
