name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC394 mobile landscape live fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          m='<!-- RC394 MOBILE LANDSCAPE LIVE 16:9 FULLSCREEN -->'
          css=m+'\n<style id="rc394-mobile-landscape-live-16x9">@media (orientation:landscape) and (pointer:coarse) and (max-width:1100px){body[data-live-mode="live"] #liveCenter.active{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;margin:0!important;padding:0!important;background:#000!important;overflow:hidden!important}body[data-live-mode="live"] #liveCenter.active .center,body[data-live-mode="live"] #liveCenter.active .center>div,body[data-live-mode="live"] #liveCenter.active .center>div>div:nth-of-type(3){position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;background:#000!important;overflow:hidden!important;box-sizing:border-box!important}body[data-live-mode="live"] #liveCenter.active #liveMain{position:relative!important;width:min(100vw,calc(100dvh * 16 / 9))!important;height:min(100dvh,calc(100vw * 9 / 16))!important;min-width:0!important;min-height:0!important;max-width:100vw!important;max-height:100dvh!important;aspect-ratio:16/9!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:#000!important;overflow:hidden!important;box-sizing:border-box!important;flex:none!important}body[data-live-mode="live"] #liveCenter.active #livePlayerWrap,body[data-live-mode="live"] #liveCenter.active #rc275LiveFrame,body[data-live-mode="live"] #liveCenter.active #livePlayer{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:#000!important;object-fit:contain!important;overflow:hidden!important;box-sizing:border-box!important}body[data-live-mode="live"] #liveCenter.active .eyebrow,body[data-live-mode="live"] #liveCenter.active h2,body[data-live-mode="live"] #liveCenter.active #liveState,body[data-live-mode="live"] #liveCenter.active #publicLiveBadge,body[data-live-mode="live"] #liveCenter.active #liveControls,body[data-live-mode="live"] #liveCenter.active #stateLive,body[data-live-mode="live"] #liveCenter.active #liveRouteStatus,body[data-live-mode="live"] #liveCenter.active #returnLobby{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}}</style>\n'
          if m not in h:
              if '</head>' not in h: raise SystemExit('Missing head anchor')
              p.write_text(h.replace('</head>',css+'</head>',1),encoding='utf-8')
          PY
      - name: Verify RC394 patch
        run: |
          grep -q 'rc394-mobile-landscape-live-16x9' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
      - name: Commit RC394 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC394 already applied'; else git add public/index.html && git commit -m 'RC394 mobile landscape live 16x9 fullscreen' && git push origin HEAD:main; fi
