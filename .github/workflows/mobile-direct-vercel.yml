name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC396 automatic mobile landscape fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          m='<!-- RC396 MOBILE LIVE AUTO LANDSCAPE FULLSCREEN -->'
          patch=m+'''\n<script id="rc396-mobile-live-auto-landscape-fullscreen">\n(()=>{\n  const coarse=()=>matchMedia('(pointer:coarse)').matches&&innerWidth<=1100;\n  const landscape=()=>matchMedia('(orientation:landscape)').matches;\n  const liveActive=()=>document.body?.dataset.liveMode==='live'&&document.getElementById('liveCenter')?.classList.contains('active');\n  const target=()=>document.getElementById('livePlayer')||document.getElementById('livePlayerWrap')||document.getElementById('liveMain');\n  let armed=false;\n  const request=async()=>{\n    if(!coarse()||!landscape()||!liveActive()||document.fullscreenElement)return;\n    const el=target(); if(!el)return;\n    try{\n      if(el.requestFullscreen) await el.requestFullscreen({navigationUI:'hide'});\n      else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();\n      else if(el.webkitEnterFullscreen) el.webkitEnterFullscreen();\n    }catch(_e){}\n  };\n  const exit=async()=>{\n    if(landscape())return;\n    try{if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();}\n    catch(_e){}\n  };\n  const sync=()=>{\n    if(!coarse())return;\n    if(landscape()&&liveActive())request(); else exit();\n  };\n  const arm=()=>{\n    if(armed)return; armed=true;\n    const gesture=()=>{if(landscape()&&liveActive())request()};\n    window.addEventListener('pointerup',gesture,{capture:true,passive:true});\n    window.addEventListener('touchend',gesture,{capture:true,passive:true});\n  };\n  arm();\n  screen.orientation?.addEventListener?.('change',()=>setTimeout(sync,80));\n  window.addEventListener('orientationchange',()=>setTimeout(sync,120));\n  window.addEventListener('resize',()=>setTimeout(sync,100));\n  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&landscape()&&liveActive())setTimeout(request,80)});\n})();\n</script>\n'''
          if m not in h:
              if '</body>' not in h: raise SystemExit('Missing body anchor')
              p.write_text(h.replace('</body>',patch+'</body>',1),encoding='utf-8')
          PY
      - name: Verify RC396 patch
        run: |
          grep -q 'rc396-mobile-live-auto-landscape-fullscreen' public/index.html
          grep -q 'rc395-mobile-landscape-live-fill' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
      - name: Commit RC396 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC396 already applied'; else git add public/index.html && git commit -m 'RC396 mobile live automatic landscape fullscreen' && git push origin HEAD:main; fi
