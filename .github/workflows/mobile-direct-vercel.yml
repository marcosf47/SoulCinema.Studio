name: SoulCinema Direct Vercel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC429
        run: python3 .github/scripts/rc429.py
      - name: Verify RC429
        run: grep -q 'RC429 LIVE FULLSCREEN USER-ACTIVATION BRIDGE' public/index.html && grep -q 'rc429-live-fullscreen-user-activation-bridge' public/index.html && grep -q 'RC428 EXACT RC400 LIVE FULLSCREEN RESTORE' public/index.html && grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html && ! grep -q 'rc426-restore-mobile-live-fullscreen' public/index.html && ! grep -q 'rc427-native-live-fullscreen-on-entry' public/index.html && grep -q 'RC425 MOBILE THEATER STAGE GUARD' public/index.html && grep -q 'RC424 DISTINCT FEATURE FILM HANDOFF' public/index.html && grep -q 'RC418 THEATER FULLSCREEN EXIT ISOLATION' public/index.html && grep -q "liveRoom?.contains(fs)" public/index.html && grep -q 'RC417 NATIVE THEATER FULLSCREEN ONLY' public/index.html && grep -q 'RC414 MOBILE CINEMATIC PORTALS REBUILD' public/index.html
      - name: Commit source
        run: git config user.name 'SoulCinema Direct Deploy' && git config user.email 'actions@users.noreply.github.com' && git add public/index.html && git commit -m 'RC429 restore Live fullscreen user activation bridge' && git push origin HEAD:main
