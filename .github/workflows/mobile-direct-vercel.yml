name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC295 restore mobile lobby control layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- RC295 MOBILE LOBBY CONTROL LAYOUT RESTORE -->'
          if marker not in html:
              anchor='\n<!-- RC294 MOBILE SKIP SOFT FULL HITBOX OWNER -->'
              if html.count(anchor)!=1:
                  raise SystemExit(f'RC294 anchor count={html.count(anchor)}; refusing to guess')
              patch=r'''
<!-- RC295 MOBILE LOBBY CONTROL LAYOUT RESTORE -->
<style id="rc295-mobile-lobby-control-layout-restore">
@media(max-width:700px){
  #lobby #skip{
    position:absolute!important;
    right:18px!important;
    left:auto!important;
    bottom:18px!important;
    top:auto!important;
    margin:0!important;
    transform:none!important;
    z-index:1200!important;
  }
  #lobby .audio{
    position:absolute!important;
    left:18px!important;
    right:auto!important;
    top:72px!important;
    bottom:auto!important;
    margin:0!important;
    transform:none!important;
    z-index:20!important;
  }
}
</style>
'''
              html=html.replace(anchor,'\n'+patch+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC295 and preserve current locks
        run: |
          grep -q 'RC295 MOBILE LOBBY CONTROL LAYOUT RESTORE' public/index.html
          grep -q 'RC294 MOBILE SKIP SOFT FULL HITBOX OWNER' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'RC292 MOBILE PORTAL THEATER GHOST PLAY GUARD' public/index.html
          grep -q 'RC291 MOBILE PORTAL AMBIENT HARD FREEZE' public/index.html
          grep -q 'RC290 MOBILE PORTAL HARD MEDIA FREEZE' public/index.html
          grep -q 'RC289 MOBILE PORTAL SINGLE OWNER + QUIET MEDIA' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html
          grep -q 'RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP' public/index.html

      - name: Commit RC295 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC295 already applied"
          else
            git add public/index.html
            git commit -m "RC295 restore mobile lobby control layout"
            git push origin HEAD:main
          fi
