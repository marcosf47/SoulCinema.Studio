name: SoulCinema Direct Vercel
on:
  push:
    branches: [main]
    paths: [.github/workflows/mobile-direct-vercel.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC439
        run: python3 .github/scripts/rc439.py
      - name: Verify RC439
        run: 'grep -q "RC439 MOBILE LIVE ENTRY TRUE FULLSCREEN LOCK" public/index.html && ! grep -q "RC438 MOBILE LIVE FULLSCREEN HOLD GUARD" public/index.html && grep -q "RC437 MOBILE LIVE NATIVE FULLSCREEN AUTHORITY" public/index.html && grep -q "RC433 NATIVE MOBILE LIVE FULLSCREEN ONLY" public/index.html && grep -q "RC418 THEATER FULLSCREEN EXIT ISOLATION" public/index.html && grep -q "RC417 NATIVE THEATER FULLSCREEN ONLY" public/index.html && grep -q "RC414 MOBILE CINEMATIC PORTALS REBUILD" public/index.html'
      - name: Commit source
        run: git config user.name 'SoulCinema Direct Deploy' && git config user.email 'actions@users.noreply.github.com' && git add public/index.html && git commit -m 'RC439 lock mobile Live fullscreen on entry gesture' && git push origin HEAD:main
