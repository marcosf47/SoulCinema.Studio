name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC399 mobile live native fullscreen on direct gesture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          m='<!-- RC399 MOBILE LIVE DIRECT-GESTURE NATIVE FULLSCREEN -->'
          patch=m+'''\n<script id="rc399-mobile-live-direct-gesture-native-fullscreen">\n(()=>{\n const mobile=()=>matchMedia('(pointer:coarse)').matches&&Math.max(screen.width,screen.height)<=1400;\n const active=()=>document.body?.dataset.liveMode==='live'&&document.getElementById('liveCenter')?.classList.contains('active');\n const frame=()=>document.getElementById('rc275LiveFrame');\n const prep=()=>{const f=frame();if(!f)return null;f.allowFullscreen=true;f.setAttribute('allowfullscreen','');f.setAttribute('webkitallowfullscreen','');const a=f.getAttribute('allow')||'';if(!a.includes('fullscreen'))f.setAttribute('allow',(a?a+'; ':'')+'fullscreen *');return f};\n const enter=()=>{if(!mobile()||!active()||document.fullscreenElement)return false;const f=prep();if(!f)return false;try{if(f.requestFullscreen){f.requestFullscreen({navigationUI:'hide'}).catch(()=>{});return true}if(f.webkitRequestFullscreen){f.webkitRequestFullscreen();return true}}catch(_e){}return false};\n const direct=(e)=>{if(!mobile()||!active())return;const f=frame();const wrap=document.getElementById('livePlayer')||document.getElementById('livePlayerWrap')||document.getElementById('liveMain');const t=e.target;if(!(t===f||f?.contains?.(t)||wrap?.contains?.(t)))return;enter()};\n document.addEventListener('pointerup',direct,true);\n document.addEventListener('touchend',direct,{capture:true,passive:true});\n const orient=()=>{if(!mobile()||!active())return;if(matchMedia('(orientation:portrait)').matches&&document.fullscreenElement){document.exitFullscreen?.().catch?.(()=>{})}};\n window.addEventListener('orientationchange',orient);screen.orientation?.addEventListener?.('change',orient);\n prep();\n})();\n</script>\n'''
          if m not in h:
              if '</body>' not in h: raise SystemExit('Missing body anchor')
              p.write_text(h.replace('</body>',patch+'</body>',1),encoding='utf-8')
          PY
      - name: Verify RC399 patch
        run: |
          grep -q 'rc399-mobile-live-direct-gesture-native-fullscreen' public/index.html
          grep -q 'rc398-mobile-live-fullscreen-gesture-arm' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
      - name: Commit RC399 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC399 already applied'; else git add public/index.html && git commit -m 'RC399 mobile live native fullscreen on direct gesture' && git push origin HEAD:main; fi
