name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC304 desktop Live Center recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          start='<!-- RC303 DESKTOP LIVE CENTER LUXURY + ALWAYS FULLSCREEN -->'
          end='<!-- RC302 DESKTOP LIVE CENTER FULLSCREEN BUTTON FORCE VISIBLE -->'
          if html.count(start)!=1 or html.count(end)!=1:
              raise SystemExit(f'anchors invalid rc303={html.count(start)} rc302={html.count(end)}; refusing to guess')
          payload=';;;'
          patch=base64.b64decode(payload).decode('utf-8')
          a=html.index(start)
          b=html.index(end)
          if a>=b:
              raise SystemExit('RC303/RC302 order invalid; refusing to guess')
          html=html[:a]+patch+'\n'+html[b:]
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC304 and preserve locks
        run: |
          grep -q 'RC304 DESKTOP LIVE CENTER RECOVERY + RC303 REPAIR' public/index.html
          ! grep -q 'RC303 DESKTOP LIVE CENTER LUXURY + ALWAYS FULLSCREEN' public/index.html
          grep -q 'RC302 DESKTOP LIVE CENTER FULLSCREEN BUTTON FORCE VISIBLE' public/index.html
          grep -q 'RC301 DESKTOP LIVE CENTER REMOVE LOWER LIVE BADGE' public/index.html
          grep -q 'RC300 DESKTOP LIVE CENTER FIT + NATIVE FULLSCREEN RESTORE' public/index.html
          grep -q 'RC299 DESKTOP LIVE CENTER LUXURY LARGER SCREEN' public/index.html
          grep -q 'RC298 DESKTOP LIVE CENTER FULLSCREEN CONTROL' public/index.html
          grep -q 'RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT' public/index.html
          grep -q 'RC277 DESKTOP LIVE CENTER RETURN' public/index.html
          grep -q 'RC275 SOULCINEMA LIVE CENTER VPS EMBED RECOVERY' public/index.html
          grep -q 'RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Commit RC304 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC304 already applied"
          else
            git add public/index.html
            git commit -m "RC304 desktop Live Center recovery and RC303 repair"
            git push origin HEAD:main
          fi
