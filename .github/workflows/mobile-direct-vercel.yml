name: SoulCinema Direct Vercel
on:
  push:
    branches: [main]
    paths: [.github/workflows/mobile-direct-vercel.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC437
        run: python3 .github/scripts/rc437.py
      - name: Verify RC437
        run: 'grep -q "RC437 MOBILE LIVE NATIVE FULLSCREEN AUTHORITY" public/index.html && grep -q "RC433 NATIVE MOBILE LIVE FULLSCREEN ONLY" public/index.html && ! grep -q "RC400 MASTER MOBILE LIVE FULLSCREEN AUTHORITY" public/index.html && ! grep -q "RC436 MOBILE LIVE LANDSCAPE AUTHORITY TRIGGER REPAIR" public/index.html && ! grep -q "RC434 MOBILE LIVE LANDSCAPE FULLSCREEN ENHANCEMENT" public/index.html && ! grep -q "rc432LiveFullscreen" public/index.html && grep -q "RC418 THEATER FULLSCREEN EXIT ISOLATION" public/index.html && grep -q "RC417 NATIVE THEATER FULLSCREEN ONLY" public/index.html && grep -q "RC414 MOBILE CINEMATIC PORTALS REBUILD" public/index.html'
      - name: Commit source
        run: git config user.name 'SoulCinema Direct Deploy' && git config user.email 'actions@users.noreply.github.com' && git add public/index.html && git commit -m 'RC437 isolate mobile Live native fullscreen authority' && git push origin HEAD:main
