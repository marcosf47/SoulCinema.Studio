name: SoulCinema Direct Vercel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC414
        run: python3 .github/scripts/rc414.py
      - name: Verify RC414
        run: grep -q 'RC414 MOBILE CINEMATIC PORTALS REBUILD' public/index.html && grep -q 'rc414-mobile-cinematic-portals-controller' public/index.html && grep -q 'scRc414OpenRoom' public/index.html && grep -q 'rc404-mobile-theater-premiere-reveal' public/index.html && grep -q 'rc407-isolated-mobile-theater-landscape-player' public/index.html && grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html && ! grep -q 'rc408-theater-native-fullscreen-gesture' public/index.html
      - name: Commit source
        run: git config user.name 'SoulCinema Direct Deploy' && git config user.email 'actions@users.noreply.github.com' && git add public/index.html && git commit -m 'RC414 cinematic mobile portals rebuild' && git push origin HEAD:main
