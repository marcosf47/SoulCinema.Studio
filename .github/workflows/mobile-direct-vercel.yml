name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC312 desktop Live Now panel and return lobby
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- RC312 DESKTOP LIVE NOW PANEL + RETURN LOBBY -->'
          anchor='<!-- RC311 DESKTOP LIVE NOW PANEL SHIFT LEFT -->'
          payload=''
          patch=base64.b64decode(payload).decode('utf-8')
          if marker not in html:
              if html.count(anchor)!=1:
                  raise SystemExit('RC311 anchor mismatch; refusing to guess')
              html=html.replace(anchor,patch+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC312 and preserve locks
        run: |
          grep -q 'RC312 DESKTOP LIVE NOW PANEL + RETURN LOBBY' public/index.html
          grep -q 'RC311 DESKTOP LIVE NOW PANEL SHIFT LEFT' public/index.html
          grep -q 'RC310 DESKTOP LIVE CENTER HARD SIZE CAP' public/index.html
          grep -q 'RC305 DESKTOP LIVE CENTER IFRAME STATE AUTHORITY' public/index.html
          grep -q 'RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Commit RC312 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC312 already applied"
          else
            git add public/index.html
            git commit -m "RC312 desktop Live Now panel and return lobby fix"
            git push origin HEAD:main
          fi
