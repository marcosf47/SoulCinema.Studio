name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC258 mobile theater restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='rc258-mobile-screening-theater-restore'
          if marker not in html:
              patch=r'''
          <style id="rc258-mobile-screening-theater-restore">
          /* RC258 — MOBILE SCREENING THEATER CONTENT RESTORE.
             Mobile only. Desktop remains locked. Existing DOM/media/routing preserved. */
          @media(max-width:700px){
            #screeningTheater .collection-strip{
              display:grid!important;
              grid-template-columns:1fr!important;
              gap:10px!important;
              width:100%!important;
              padding:0!important;
              margin:0!important;
              visibility:visible!important;
              opacity:1!important;
            }
            #screeningTheater .collection-card{
              display:flex!important;
              width:100%!important;
              min-height:88px!important;
              padding:14px 16px!important;
              visibility:visible!important;
              opacity:1!important;
              pointer-events:auto!important;
              touch-action:manipulation!important;
            }
            #screeningTheater .collection-card small{
              font-size:9px!important;
              line-height:1.2!important;
            }
            #screeningTheater .collection-card strong{
              font-size:17px!important;
              line-height:1.18!important;
            }
            #screeningTheater #theaterPlay{
              display:grid!important;
              place-items:center!important;
              visibility:visible!important;
              opacity:1!important;
              pointer-events:auto!important;
              position:relative!important;
              z-index:30!important;
              width:64px!important;
              height:64px!important;
              min-width:64px!important;
              min-height:64px!important;
              margin:18px auto 0!important;
            }
            #screeningTheater .theater-poster-copy{overflow:visible!important;}
          }
          </style>
          '''
              html=html.replace('</body></html>',patch+'\n</body></html>')
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC258 mobile build
        run: |
          grep -q 'RC238' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN secret is missing'; exit 78; }

      - name: Deploy patched public index directly to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_Kza5QHnOwkC1YjzhY69oL531
          VERCEL_PROJECT_ID: prj_dLhMDvUUslk57GbGWuBshzNGaHk4
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          html=open('public/index.html',encoding='utf-8').read()
          payload={
            'name':'soulcinema-music-discovery',
            'project':os.environ['VERCEL_PROJECT_ID'],
            'target':'production',
            'files':[{'file':'index.html','data':html}],
            'projectSettings':{'framework':None}
          }
          req=urllib.request.Request(
            'https://api.vercel.com/v13/deployments?teamId='+os.environ['VERCEL_TEAM_ID'],
            data=json.dumps(payload).encode(),
            method='POST',
            headers={'Authorization':'Bearer '+os.environ['VERCEL_TOKEN'],'Content-Type':'application/json'}
          )
          with urllib.request.urlopen(req, timeout=120) as r:
            body=json.load(r)
          print('DEPLOYMENT_ID='+str(body.get('id')))
          print('DEPLOYMENT_URL='+str(body.get('url')))
          print('READY_STATE='+str(body.get('readyState')))
          PY

      - name: Lock RC258 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC258 already locked in source"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "fix mobile screening theater content visibility"
            git push origin HEAD:main
          fi
