name: SoulCinema Direct Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify emergency RC443 safe baseline
        run: |
          grep -q "RC443 MOBILE LIVE LANDSCAPE TAP TRUE FULLSCREEN" public/index.html
          ! grep -q "RC444 MOBILE LIVE LANDSCAPE ONE-TOUCH FULLSCREEN GATE" public/index.html
          grep -q "RC437 MOBILE LIVE NATIVE FULLSCREEN AUTHORITY" public/index.html
          grep -q "RC433 NATIVE MOBILE LIVE FULLSCREEN ONLY" public/index.html
          grep -q "RC418 THEATER FULLSCREEN EXIT ISOLATION" public/index.html
          grep -q "RC414 MOBILE CINEMATIC PORTALS REBUILD" public/index.html
      - name: Confirm source
        run: echo "SoulCinema production source verified for direct Vercel deployment"
      - name: Install Vercel Web Analytics tracking surgically
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<script defer src="/_vercel/insights/script.js"></script>'
          init = '<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>'
          for name in ('public/index.html', 'public/mobile-v2.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if tag not in s:
                  if '</head>' not in s: raise SystemExit(f'Missing </head> in {name}')
                  s = s.replace('</head>', init + tag + '</head>', 1)
              elif init not in s:
                  s = s.replace(tag, init + tag, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Install mobile social rail surgically
        run: echo "Social rail already locked in mobile-v2"
      - name: Apply Mobile Live automatic 16x9 landscape
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/mobile-v2.html')
          s=p.read_text(encoding='utf-8')
          marker='SOULCINEMA LIVE LANDSCAPE 16X9 LOCK V1'
          css='''\n/* SOULCINEMA LIVE LANDSCAPE 16X9 LOCK V1 */\nbody.v2-live-16x9{overflow:hidden!important;background:#000!important}\nbody.v2-live-16x9 .top,body.v2-live-16x9 .nav,body.v2-live-16x9 .scSocialRail,body.v2-live-16x9 #live>.back,body.v2-live-16x9 #live .roomHero>.eyebrow,body.v2-live-16x9 #live .roomHero>h1,body.v2-live-16x9 #live .roomHero>p,body.v2-live-16x9 #live .roomHero>.note{display:none!important}\nbody.v2-live-16x9 .app,body.v2-live-16x9 #live.active,body.v2-live-16x9 #live.active>.roomHero{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:#000!important;box-shadow:none!important}\nbody.v2-live-16x9 #v2LiveMount{position:fixed!important;left:50%!important;top:50%!important;right:auto!important;bottom:auto!important;transform:translate(-50%,-50%)!important;width:min(100vw,calc(100dvh * 16 / 9))!important;height:min(100dvh,calc(100vw * 9 / 16))!important;aspect-ratio:16/9!important;margin:0!important;border:0!important;border-radius:0!important;background:#000!important;overflow:hidden!important;z-index:2147483000!important}\nbody.v2-live-16x9 #v2LiveOwner{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important;background:#000!important}\n'''
          old='function syncCinemaLandscape(){const id=document.querySelector(".view.active")?.id;document.body.classList.toggle("v2-cinema-landscape",matchMedia("(orientation:landscape)").matches&&(id==="theater"||id==="live"))} addEventListener("orientationchange",()=>setTimeout(syncCinemaLandscape,80));addEventListener("resize",syncCinemaLandscape);'
          new='function syncCinemaLandscape(){const id=document.querySelector(".view.active")?.id,vv=window.visualViewport,w=vv?.width||innerWidth,h=vv?.height||innerHeight,isLandscape=w>h;document.body.classList.toggle("v2-cinema-landscape",isLandscape&&(id==="theater"||id==="live"));document.body.classList.toggle("v2-live-16x9",isLandscape&&id==="live")} function resyncCinemaLandscape(){syncCinemaLandscape();setTimeout(syncCinemaLandscape,120);setTimeout(syncCinemaLandscape,360)} addEventListener("orientationchange",resyncCinemaLandscape);addEventListener("resize",resyncCinemaLandscape);window.visualViewport?.addEventListener("resize",resyncCinemaLandscape);'
          if marker not in s:
              if s.count('</style>')!=1: raise SystemExit('Landscape guard: style boundary')
              s=s.replace('</style>',css+'</style>',1)
          if old in s:
              s=s.replace(old,new,1)
          elif 'v2-live-16x9' not in s[s.find('function syncCinemaLandscape'):]:
              raise SystemExit('Landscape guard: JS authority not found')
          if s.count(marker)!=1: raise SystemExit('Landscape marker guard failed')
          if 'visualViewport?.addEventListener("resize",resyncCinemaLandscape)' not in s: raise SystemExit('Landscape rotation guard failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply Films first-rotation landscape race guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/mobile-v2.html')
          s=p.read_text(encoding='utf-8')
          marker='SOULCINEMA FILMS FIRST ROTATION LANDSCAPE LOCK V1'
          css='''\n/* SOULCINEMA FILMS FIRST ROTATION LANDSCAPE LOCK V1 */\nbody.v2-cinema-landscape:has(#theater.active){overflow:hidden!important;background:#000!important}\nbody.v2-cinema-landscape:has(#theater.active) .top,body.v2-cinema-landscape:has(#theater.active) .nav,body.v2-cinema-landscape:has(#theater.active) .scSocialRail,body.v2-cinema-landscape #theater.active>.back,body.v2-cinema-landscape #theater.active .roomHero>.eyebrow,body.v2-cinema-landscape #theater.active .roomHero>h1,body.v2-cinema-landscape #theater.active .roomHero>p,body.v2-cinema-landscape #theater.active #filmList{display:none!important}\nbody.v2-cinema-landscape #theater.active,body.v2-cinema-landscape #theater.active>.roomHero{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:#000!important;box-shadow:none!important}\nbody.v2-cinema-landscape #theater.active .mediaFrame{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;margin:0!important;border:0!important;border-radius:0!important;background:#000!important;display:grid!important;place-items:center!important;z-index:2147482900!important}\nbody.v2-cinema-landscape #theater.active .mediaFrame video{display:block!important;width:100vw!important;height:100dvh!important;max-width:100vw!important;max-height:100dvh!important;object-fit:contain!important;background:#000!important}\n'''
          if marker not in s:
              if s.count('</style>')!=1: raise SystemExit('Films landscape guard: style boundary')
              s=s.replace('</style>',css+'</style>',1)
          if s.count(marker)!=1: raise SystemExit('Films landscape marker guard failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit surgical mobile landscape patch
        run: |
          if git diff --quiet -- public/index.html public/mobile-v2.html; then echo "Landscape patches already installed"; exit 0; fi
          git config user.name "SoulCinema C.D."
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html public/mobile-v2.html
          git commit -m "Films: lock first-rotation landscape continuity"
          git push origin HEAD:main
