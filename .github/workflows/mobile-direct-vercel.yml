name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC270 mobile portal click authority and media hard stop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC270 MASTER MOBILE PORTAL CLICK AUTHORITY + MEDIA HARD STOP'
          if marker not in html:
              patch=r'''
<!-- RC270 MASTER MOBILE PORTAL CLICK AUTHORITY + MEDIA HARD STOP -->
<script id="rc270-mobile-portal-click-authority">
(()=>{
  'use strict';
  const mobile=()=>matchMedia('(max-width:700px)').matches;
  const lobby=()=>document.getElementById('lobby');
  const portals=()=>document.getElementById('portals');
  const portalActive=()=>!!(mobile()&&lobby()?.classList.contains('portal-mode')&&portals()?.classList.contains('show'));
  const hardStop=()=>{
    if(!mobile())return;
    document.querySelectorAll('#lobby video,#lobby audio').forEach(m=>{try{m.pause()}catch(_e){}});
    const lv=document.getElementById('lobbyVideo'); try{lv?.pause()}catch(_e){}
    const amb=document.getElementById('ambient'); try{amb?.pause()}catch(_e){}
  };
  const lockAndStop=()=>{
    if(!mobile())return;
    document.body.dataset.mobilePortalLock='1';
    hardStop();
    [0,80,220,520,900,1500].forEach(ms=>setTimeout(hardStop,ms));
  };
  const route=(room)=>{
    lockAndStop();
    if(room==='Screening Theater'){ if(typeof openTheater==='function')openTheater(); return; }
    if(room==='Music Room'){ if(typeof openMusic==='function')openMusic(); return; }
    if(room==='Live Center'){ if(typeof openLive==='function')openLive(); return; }
    if(room==='Production Room'){
      if(typeof openProductionHard==='function')openProductionHard();
      else if(typeof openProduction==='function')openProduction();
      return;
    }
    if(room==='Story Room'){ if(typeof openStory==='function')openStory(); return; }
    if(room==='Journal'){ if(typeof openJournal==='function')openJournal(); return; }
    if(room==='Visual Bible'){
      if(typeof openBibleHard==='function')openBibleHard();
      else if(typeof openBible==='function')openBible();
      return;
    }
    if(room==='About Us'){ if(typeof openAbout==='function')openAbout(); return; }
    if(room==='Contact'){ if(typeof openContact==='function')openContact(); return; }
  };

  // Window-capture CLICK only. No touchstart/touchmove/pointerdown, so RC268 native scroll remains untouched.
  window.addEventListener('click',e=>{
    if(!portalActive())return;
    const target=e.target?.closest?.('#portals [data-room]');
    if(!target)return;
    const room=target.dataset.room;
    if(!room)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    route(room);
  },true);

  // If any stale owner tries to restart Lobby media after Skip/room routing, kill it immediately.
  document.addEventListener('play',e=>{
    if(!mobile()||document.body.dataset.mobilePortalLock!=='1')return;
    const m=e.target;
    if(m && (m.id==='lobbyVideo'||m.id==='ambient'||m.closest?.('#lobby'))){
      try{m.pause()}catch(_e){}
    }
  },true);
})();
</script>
'''
              if html.count('</body>')!=1:
                  raise SystemExit('Expected exactly one </body>; refusing to guess')
              html=html.replace('</body>',patch+'\n</body>',1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC270 and preserve RC268 scroll
        run: |
          grep -q 'RC270 MASTER MOBILE PORTAL CLICK AUTHORITY + MEDIA HARD STOP' public/index.html
          grep -q 'rc270-mobile-portal-click-authority' public/index.html
          grep -q 'Window-capture CLICK only' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'rc268-mobile-native-portal-scroll' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC270 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC270 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC270 master mobile portal click authority and media hard stop"
            git push origin HEAD:main
          fi
