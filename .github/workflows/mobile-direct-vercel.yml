name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC261 exact gate fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC261 MASTER MOBILE THE GATE BACK FIX'
          start_token="    const hardGate=()=>{\n"
          end_token="    const activateLobby=()=>{\n"
          if marker not in html:
              starts=[]
              pos=0
              while True:
                  i=html.find(start_token,pos)
                  if i<0: break
                  starts.append(i)
                  pos=i+1
              if len(starts)!=1:
                  raise SystemExit(f'Expected exactly one hardGate block, found {len(starts)}; refusing to guess')
              start=starts[0]
              end=html.find(end_token,start)
              if end<0:
                  raise SystemExit('activateLobby boundary not found; refusing to guess')
              old=html[start:end]
              required=["cleanLobbyState();","gate.classList.add('active')","dataset.experience='gate'","setTimeout(cleanLobbyState,80)"]
              for needle in required:
                  if needle not in old:
                      raise SystemExit(f'hardGate invariant missing: {needle}; refusing to guess')
              new="""    const hardGate=()=>{
      /* RC261 MASTER MOBILE THE GATE BACK FIX */
      if(matchMedia('(max-width:700px)').matches){
        const lastTimer=setTimeout(()=>{},0);
        for(let i=0;i<=lastTimer;i++)clearTimeout(i);
        clearTimeout(lastTimer);
        document.querySelectorAll('#lobby video,#lobby audio').forEach(m=>{
          try{m.pause();}catch(_e){}
          try{m.currentTime=0;}catch(_e){}
        });
      }
      cleanLobbyState();
      document.querySelectorAll('.scene.active').forEach(s=>s.classList.remove('active'));
      if(gate)gate.classList.add('active');
      if(document.body){
        document.body.dataset.scene='gate';
        document.body.dataset.experience='gate';
        document.body.classList.remove('gate-lobby-fluid','gate-lobby-soft');
      }
      if(matchMedia('(max-width:700px)').matches)cleanLobbyState();
      else setTimeout(cleanLobbyState,80);
    };
"""
              html=html[:start]+new+html[end:]
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC261
        run: |
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'RC260 MASTER FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC261 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC261 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC261 master mobile The Gate back fix"
            git push origin HEAD:main
          fi
