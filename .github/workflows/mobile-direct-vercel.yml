name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC309 desktop Live Center exact compact composition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          html = p.read_text(encoding='utf-8')
          marker = '<!-- RC309 DESKTOP LIVE CENTER EXACT COMPACT COMPOSITION -->'
          anchor = '<!-- RC308 DESKTOP LIVE CENTER 16X9 FIT + FULLSCREEN POLISH -->'
          patch = '''<!-- RC309 DESKTOP LIVE CENTER EXACT COMPACT COMPOSITION -->
<style id="rc309-desktop-live-exact-compact">
@media (min-width:861px) {
#liveCenter.active {height:100dvh!important;max-height:100dvh!important;overflow:hidden!important;box-sizing:border-box!important;}
#liveCenter.active #livePlayerWrap {position:absolute!important;top:158px!important;left:52px!important;right:auto!important;bottom:auto!important;width:calc(100vw - 390px)!important;height:auto!important;aspect-ratio:16/9!important;max-height:calc(100dvh - 245px)!important;max-width:calc((100dvh - 245px)*16/9)!important;margin:0!important;overflow:hidden!important;box-sizing:border-box!important;border-radius:20px!important;}
#liveCenter.active #rc275LiveFrame {position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;border:0!important;border-radius:19px!important;}
#liveCenter.active #rc307LiveInfo {top:158px!important;right:52px!important;bottom:auto!important;width:270px!important;height:min(calc(100dvh - 245px),500px)!important;min-height:0!important;max-height:500px!important;overflow:hidden!important;}
#liveCenter.active #rc298LiveFullscreen {top:16px!important;right:16px!important;z-index:120!important;}
#livePlayerWrap:fullscreen,#livePlayerWrap:-webkit-full-screen {position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important;aspect-ratio:auto!important;margin:0!important;border:0!important;border-radius:0!important;background:#000!important;overflow:hidden!important;}
#livePlayerWrap:fullscreen #rc275LiveFrame,#livePlayerWrap:-webkit-full-screen #rc275LiveFrame {position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border-radius:0!important;}
}
</style>
'''
          if marker not in html:
              if html.count(anchor) != 1:
                  raise SystemExit('RC308 anchor mismatch; refusing to guess')
              html = html.replace(anchor, patch + anchor, 1)
              p.write_text(html, encoding='utf-8')
          PY

      - name: Verify RC309 and preserve locks
        run: |
          grep -q 'RC309 DESKTOP LIVE CENTER EXACT COMPACT COMPOSITION' public/index.html
          grep -q 'RC308 DESKTOP LIVE CENTER 16X9 FIT + FULLSCREEN POLISH' public/index.html
          grep -q 'RC307 DESKTOP LIVE CENTER LUXURY COMPOSITION' public/index.html
          grep -q 'RC305 DESKTOP LIVE CENTER IFRAME STATE AUTHORITY' public/index.html
          grep -q 'RC304 DESKTOP LIVE CENTER RECOVERY OWNER' public/index.html
          grep -q 'RC298 DESKTOP LIVE CENTER FULLSCREEN CONTROL' public/index.html
          grep -q 'RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT' public/index.html
          grep -q 'RC275 SOULCINEMA LIVE CENTER VPS EMBED RECOVERY' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Commit RC309 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then
            echo 'RC309 already applied'
          else
            git add public/index.html
            git commit -m 'RC309 exact desktop Live Center compact composition'
            git push origin HEAD:main
          fi
