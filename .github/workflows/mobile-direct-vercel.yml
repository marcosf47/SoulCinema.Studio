name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC395 mobile landscape live fill viewport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          m='<!-- RC395 MOBILE LANDSCAPE LIVE FILL VIEWPORT -->'
          css=m+'\n<style id="rc395-mobile-landscape-live-fill">@media (orientation:landscape) and (pointer:coarse) and (max-width:1100px){body[data-live-mode="live"] #liveCenter.active,body[data-live-mode="live"] #liveCenter.active .center,body[data-live-mode="live"] #liveCenter.active .center>div,body[data-live-mode="live"] #liveCenter.active .center>div>div:nth-of-type(3),body[data-live-mode="live"] #liveCenter.active #liveMain{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;min-width:100vw!important;min-height:100dvh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:#000!important;overflow:hidden!important;box-sizing:border-box!important}body[data-live-mode="live"] #liveCenter.active #livePlayerWrap,body[data-live-mode="live"] #liveCenter.active #rc275LiveFrame,body[data-live-mode="live"] #liveCenter.active #livePlayer{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:#000!important;overflow:hidden!important;box-sizing:border-box!important}body[data-live-mode="live"] #liveCenter.active #livePlayer{object-fit:cover!important}}</style>\n'
          if m not in h:
              if '</head>' not in h: raise SystemExit('Missing head anchor')
              p.write_text(h.replace('</head>',css+'</head>',1),encoding='utf-8')
          PY
      - name: Verify RC395 patch
        run: |
          grep -q 'rc395-mobile-landscape-live-fill' public/index.html
          grep -q 'rc394-mobile-landscape-live-16x9' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
      - name: Commit RC395 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC395 already applied'; else git add public/index.html && git commit -m 'RC395 mobile landscape live fill viewport' && git push origin HEAD:main; fi
