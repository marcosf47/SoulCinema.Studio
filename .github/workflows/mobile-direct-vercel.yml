name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC288 Contact single cinematic handoffs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          old_open="function openContact(){clearTimers();journeyTransition('CONTACT','STUDIO CONNECTION','LET THE NEXT STORY BEGIN',()=>{SceneManager.goTo('contact');scene(lobby,contactRoom)})}"
          new_open="function openContact(){clearTimers();journeyTransition('CONTACT','STUDIO CONNECTION','LET THE NEXT STORY BEGIN',()=>{/* RC288 CONTACT IN — SINGLE CINEMATIC HANDOFF */SceneManager.goTo('contact');lobby.classList.remove('active');contactRoom.classList.add('active');transitionCount++;updateRuntimeMonitor()})}"
          old_return="function returnFromContact(){journeyTransition('THE GRAND LOBBY','RETURNING','CHOOSE YOUR NEXT CHAPTER',()=>{SceneManager.goTo('lobby');scene(contactRoom,lobby);setTimeout(showPortals,520)})}"
          new_return="function returnFromContact(){journeyTransition('THE GRAND LOBBY','RETURNING','CHOOSE YOUR NEXT CHAPTER',()=>{/* RC288 CONTACT OUT — SINGLE CINEMATIC HANDOFF */SceneManager.goTo('lobby');contactRoom.classList.remove('active');lobby.classList.add('active');transitionCount++;updateRuntimeMonitor();setTimeout(showPortals,420)})}"
          if html.count(old_open)!=1 or html.count(old_return)!=1:
              raise SystemExit(f'Expected exact Contact targets once each; open={html.count(old_open)} return={html.count(old_return)}; refusing to guess')
          html=html.replace(old_open,new_open,1).replace(old_return,new_return,1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC288 and preserve locked layers
        run: |
          grep -q 'RC288 CONTACT IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC288 CONTACT OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          if grep -q "SceneManager.goTo('contact');scene(lobby,contactRoom)" public/index.html; then echo 'Old Contact IN nested scene remains'; exit 1; fi
          if grep -q "SceneManager.goTo('lobby');scene(contactRoom,lobby)" public/index.html; then echo 'Old Contact OUT nested scene remains'; exit 1; fi
          grep -q 'RC287 OFFICIAL SOULCINEMA CONTACT INBOX' public/index.html
          grep -q "SOULCINEMA_CONTACT_EMAIL='soulcinema77@gmail.com'" public/index.html
          grep -q 'RC286 ABOUT US IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC286 ABOUT US OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC285 VISUAL BIBLE OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC284 JOURNAL IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC284 JOURNAL OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC283 STORY ROOM IN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC283 STORY ROOM OUT — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC282 PRODUCTION ROOM RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC281 SCREENING THEATER RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC280 LIVE SAFE NATIVE RATIO FILL' public/index.html
          grep -q 'RC277 DESKTOP LIVE CENTER RETURN — SINGLE CINEMATIC HANDOFF' public/index.html
          grep -q 'RC276 LIVE AUTOPLAY BROADCAST ONLY PLAYER' public/index.html
          grep -q 'RC269 MASTER MOBILE MEDIA AUTHORITY LOCK' public/index.html
          grep -q 'RC268 MASTER MOBILE PORTAL RUNTIME CLEANUP' public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC288 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC288 already locked"
          else
            git config user.name "SoulCinema Direct Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC288 smooth Contact in and out transitions"
            git push origin HEAD:main
          fi
