name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC308 desktop Live Center 16x9 fit and fullscreen polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- RC308 DESKTOP LIVE CENTER 16X9 FIT + FULLSCREEN POLISH -->'
          anchor='<!-- RC307 DESKTOP LIVE CENTER LUXURY COMPOSITION -->'
          patch='''<!-- RC308 DESKTOP LIVE CENTER 16X9 FIT + FULLSCREEN POLISH -->
<style id="rc308-desktop-live-16x9-fit">
@media(min-width:861px){
  #liveCenter.active{height:100dvh!important;max-height:100dvh!important;overflow:hidden!important;box-sizing:border-box!important;padding-bottom:0!important}
  #liveCenter.active #livePlayerWrap{
    position:absolute!important;
    top:166px!important;
    left:52px!important;
    right:auto!important;
    bottom:auto!important;
    width:min(calc(100vw - 420px),calc((100dvh - 286px)*16/9))!important;
    height:auto!important;
    aspect-ratio:16/9!important;
    min-height:0!important;
    max-height:calc(100dvh - 286px)!important;
    margin:0!important;
    border:1px solid rgba(225,184,79,.82)!important;
    border-radius:22px!important;
    overflow:hidden!important;
    box-sizing:border-box!important;
    background:#030303!important;
    box-shadow:0 18px 65px rgba(0,0,0,.52),0 0 0 1px rgba(255,220,125,.08) inset!important;
  }
  #liveCenter.active #rc275LiveFrame{
    position:absolute!important;
    inset:0!important;
    width:100%!important;
    height:100%!important;
    max-width:100%!important;
    max-height:100%!important;
    border:0!important;
    border-radius:21px!important;
    background:#000!important;
  }
  #liveCenter.active #rc307LiveInfo{
    top:166px!important;
    right:52px!important;
    bottom:auto!important;
    width:270px!important;
    height:min(calc(100dvh - 286px),520px)!important;
    min-height:420px!important;
    overflow:hidden!important;
  }
  #liveCenter.active #rc298LiveFullscreen{
    top:18px!important;
    right:18px!important;
    z-index:95!important;
  }
  #livePlayerWrap:fullscreen,
  #livePlayerWrap:-webkit-full-screen{
    width:100vw!important;
    height:100vh!important;
    max-width:100vw!important;
    max-height:100vh!important;
    aspect-ratio:16/9!important;
    position:fixed!important;
    inset:0!important;
    margin:0!important;
    border:0!important;
    border-radius:0!important;
    background:#000!important;
    box-shadow:none!important;
  }
  #livePlayerWrap:fullscreen #rc275LiveFrame,
  #livePlayerWrap:-webkit-full-screen #rc275LiveFrame{
    width:100%!important;
    height:100%!important;
    border-radius:0!important;
    background:#000!important;
  }
  #livePlayerWrap:fullscreen #rc298LiveFullscreen,
  #livePlayerWrap:-webkit-full-screen #rc298LiveFullscreen{
    position:fixed!important;
    top:22px!important;
    right:22px!important;
    z-index:2147483647!important;
  }
}
</style>
'''
          if marker not in html:
              if html.count(anchor)!=1:
                  raise SystemExit(f'RC307 anchor count={html.count(anchor)}; refusing to guess')
              html=html.replace(anchor,patch+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC308 and preserve locks
        run: |
          grep -q 'RC308 DESKTOP LIVE CENTER 16X9 FIT + FULLSCREEN POLISH' public/index.html
          grep -q 'RC307 DESKTOP LIVE CENTER LUXURY COMPOSITION' public/index.html
          grep -q 'RC305 DESKTOP LIVE CENTER IFRAME STATE AUTHORITY' public/index.html
          grep -q 'RC304 DESKTOP LIVE CENTER RECOVERY OWNER' public/index.html
          grep -q 'RC303 DESKTOP LIVE CENTER LUXURY + ALWAYS FULLSCREEN' public/index.html
          grep -q 'RC302 DESKTOP LIVE CENTER FULLSCREEN BUTTON FORCE VISIBLE' public/index.html
          grep -q 'RC298 DESKTOP LIVE CENTER FULLSCREEN CONTROL' public/index.html
          grep -q 'RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT' public/index.html
          grep -q 'RC277 DESKTOP LIVE CENTER RETURN' public/index.html
          grep -q 'RC275 SOULCINEMA LIVE CENTER VPS EMBED RECOVERY' public/index.html
          grep -q 'RC271 DESKTOP LIVE CENTER EXIT MEDIA STOP' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Commit RC308 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC308 already applied"
          else
            git add public/index.html
            git commit -m "RC308 desktop Live Center 16x9 fit and fullscreen polish"
            git push origin HEAD:main
          fi
