name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC403 theater premiere lifecycle restoration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          # Remove the two failed post-RC400 authorities; return ownership to the proven theater engine + RC342 navigation owner.
          h=re.sub(r'<!-- RC401 MOBILE PORTAL RETURN STABILIZATION -->.*?<script id="rc401-mobile-portal-return-stabilization">.*?</script>\s*','',h,flags=re.S)
          h=re.sub(r'<!-- RC402 MOBILE THEATER LIFECYCLE RESET -->.*?<script id="rc402-mobile-theater-lifecycle-reset">.*?</script>\s*','',h,flags=re.S)
          marker='<!-- RC403 MOBILE THEATER PREMIERE LIFECYCLE RESTORE -->'
          patch=marker+'''\n<script id="rc403-mobile-theater-premiere-lifecycle-restore">\n(()=>{\n const mobile=()=>matchMedia('(max-width:860px)').matches||matchMedia('(pointer:coarse)').matches;\n const resetOpening=()=>{\n   if(!mobile())return;\n   const v=document.getElementById('theaterPlayer'),poster=document.getElementById('theaterPoster');\n   if(!v)return;\n   try{v.pause()}catch(_){};\n   try{theaterHandoffBusy=false;theaterStage='opening'}catch(_){};\n   v.classList.remove('theater-handoff','theater-portal-push','theater-feature-enter');\n   if(poster)poster.classList.remove('hidden');\n   try{primeTheaterOpening()}catch(_){\n     v.src='https://tfamln4qsost6j00.public.blob.vercel-storage.com/featured-premiere.mp4';\n     v.dataset.scStage='opening';v.preload='auto';try{v.load()}catch(__){};try{v.currentTime=0}catch(__){}\n   }\n   const title=document.getElementById('theaterCurrentTitle'),status=document.getElementById('theaterStatus');\n   if(title)title.textContent='MWEN POUKONT MWEN';if(status)status.textContent='PREMIERE READY';\n };\n document.addEventListener('pointerdown',e=>{\n   if(!mobile())return;\n   const portal=e.target.closest?.('#portals .portal[data-room="Screening Theater"],#portals .portal[data-mobile-room="Screening Theater"]');\n   if(portal)resetOpening();\n },true);\n document.addEventListener('click',e=>{\n   if(!mobile())return;\n   if(e.target.closest?.('#theaterReturn'))setTimeout(resetOpening,0);\n },true);\n window.addEventListener('pageshow',()=>{if(document.getElementById('lobby')?.classList.contains('active'))resetOpening()});\n})();\n</script>\n'''
          if marker not in h:
              if '</body>' not in h: raise SystemExit('Missing body anchor')
              h=h.replace('</body>',patch+'</body>',1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Verify RC403 surgical state
        run: |
          grep -q 'rc403-mobile-theater-premiere-lifecycle-restore' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
          grep -q 'featured-premiere.mp4' public/index.html
          grep -q 'mwen-poukont-mwen-film.mp4' public/index.html
          ! grep -q 'rc401-mobile-portal-return-stabilization' public/index.html
          ! grep -q 'rc402-mobile-theater-lifecycle-reset' public/index.html
      - name: Commit RC403 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC403 already applied'; else git add public/index.html && git commit -m 'RC403 restore mobile theater premiere lifecycle' && git push origin HEAD:main; fi
