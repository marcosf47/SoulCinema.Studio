name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC311 desktop Live Now panel shift left
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- RC311 DESKTOP LIVE NOW PANEL SHIFT LEFT -->'
          anchor='<!-- RC310 DESKTOP LIVE CENTER HARD SIZE CAP -->'
          payload='PCEtLSBSQzMxMSBERVNLVE9QIExJVkUgTk9XIFBBTkVMIFNISUZUIExFRlQgLS0+CjxzdHlsZSBpZD0icmMzMTEtZGVza3RvcC1saXZlLW5vdy1wYW5lbC1zaGlmdC1sZWZ0Ij4KQG1lZGlhIChtaW4td2lkdGg6ODYxcHgpewogICNsaXZlQ2VudGVyLmFjdGl2ZSAjcmMzMDdMaXZlSW5mb3sKICAgIHJpZ2h0Ojg0cHghaW1wb3J0YW50OwogIH0KfQo8L3N0eWxlPgo='
          patch=base64.b64decode(payload).decode('utf-8')
          if marker not in html:
              if html.count(anchor)!=1:
                  raise SystemExit('RC310 anchor mismatch; refusing to guess')
              html=html.replace(anchor,patch+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC311 and preserve locks
        run: |
          grep -q 'RC311 DESKTOP LIVE NOW PANEL SHIFT LEFT' public/index.html
          grep -q 'RC310 DESKTOP LIVE CENTER HARD SIZE CAP' public/index.html
          grep -q 'RC309 DESKTOP LIVE CENTER MASTER OVERSIZE FIX' public/index.html
          grep -q 'RC305 DESKTOP LIVE CENTER IFRAME STATE AUTHORITY' public/index.html
          grep -q 'RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Commit RC311 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC311 already applied"
          else
            git add public/index.html
            git commit -m "RC311 desktop Live Now panel shift left"
            git push origin HEAD:main
          fi
