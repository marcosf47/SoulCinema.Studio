name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC412B direct mobile portal routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          anchor='<!-- RC375 MOBILE PORTAL SCROLL + ROOM HANDOFF SMOOTHNESS -->'
          if anchor not in h:
              raise SystemExit('RC375 anchor not found')
          patch='''<!-- RC412B DIRECT MOBILE PORTAL ROUTER -->
          <style id="rc412b-direct-mobile-portal-router-css">
          @media(max-width:700px){body[data-experience="portal_mode"] #portals,body[data-experience="portal_mode"] #portals .portal,body[data-experience="portal_mode"] #portals .studio-utility-btn{pointer-events:auto!important}}
          </style>
          <script id="rc412b-direct-mobile-portal-router">
          (()=>{
            if(!matchMedia('(max-width:700px)').matches)return;
            let down=null,last=0;
            const selector='#portals .portal[data-room],#portals .portal[data-mobile-room],#portals .studio-utility-btn[data-room]';
            const roomOf=el=>el?.dataset?.mobileRoom||el?.dataset?.room||'';
            const route=room=>{
              if(typeof window.scMobileDirectOpen==='function'){window.scMobileDirectOpen(room);return}
              const portal=[...document.querySelectorAll(selector)].find(el=>roomOf(el)===room);
              if(portal){portal.click()}
            };
            document.addEventListener('pointerdown',e=>{if(document.body.dataset.experience!=='portal_mode')return;const c=e.target?.closest?.(selector);if(c)down={c,x:e.clientX,y:e.clientY}},true);
            document.addEventListener('pointerup',e=>{if(document.body.dataset.experience!=='portal_mode'||!down)return;const c=e.target?.closest?.(selector),d=down;down=null;if(!c||c!==d.c||Math.abs(e.clientX-d.x)>24||Math.abs(e.clientY-d.y)>24)return;const now=performance.now();if(now-last<350)return;last=now;e.preventDefault();e.stopImmediatePropagation();const room=roomOf(c);if(typeof openRoom==='function')openRoom(room,c);else route(room)},true);
          })();
          </script>
          '''
          if 'rc412b-direct-mobile-portal-router' not in h:
              h=h.replace(anchor,patch+anchor,1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Verify RC412B state
        run: |
          grep -q 'rc412b-direct-mobile-portal-router' public/index.html
          grep -q 'rc407-isolated-mobile-theater-landscape-player' public/index.html
          grep -q 'rc404-mobile-theater-premiere-reveal' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
          grep -q 'rc400-master-mobile-live-fullscreen-authority' public/index.html
          ! grep -q 'rc408-theater-native-fullscreen-gesture' public/index.html
      - name: Commit RC412B source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC412B already applied'; else git add public/index.html && git commit -m 'RC412B direct mobile portal routing authority' && git push origin HEAD:main; fi
