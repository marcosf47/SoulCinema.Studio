name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC259 mobile skip to portals fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='rc259-mobile-skip-to-portals-fix'
          if marker not in html:
              patch=r'''
          <script id="rc259-mobile-skip-to-portals-fix">
          (()=>{
            const mobile=()=>matchMedia('(max-width:700px)').matches;
            const activatePortals=()=>{
              const lobby=document.getElementById('lobby');
              const portals=document.getElementById('portals');
              const skip=document.getElementById('skip');
              const heart=document.querySelector('#lobby .heart-focus');
              const premiere=document.querySelector('#lobby .premiere-card');
              if(!lobby||!portals)return;
              document.querySelectorAll('.scene.active').forEach(s=>s.classList.remove('active'));
              lobby.classList.add('active','portal-mode');
              portals.classList.add('show');
              if(skip)skip.style.display='none';
              heart?.classList.remove('show');
              premiere?.classList.remove('show');
              if(document.body){
                document.body.dataset.scene='lobby';
                document.body.dataset.experience='portal_mode';
              }
            };
            document.addEventListener('click',e=>{
              if(!mobile())return;
              const btn=e.target.closest&&e.target.closest('#skip');
              if(!btn)return;
              e.preventDefault();
              e.stopImmediatePropagation();
              activatePortals();
            },true);
          })();
          </script>
          '''
              if '</body></html>' not in html:
                  raise SystemExit('closing body/html marker missing')
              html=html.replace('</body></html>',patch+'\n</body></html>')
              p.write_text(html,encoding='utf-8')
          if marker not in p.read_text(encoding='utf-8'):
              raise SystemExit('RC259 marker missing after patch')
          PY

      - name: Verify RC259 mobile build
        run: |
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html
          grep -q 'rc259-mobile-skip-to-portals-fix' public/index.html

      - name: Lock RC259 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC259 already locked in source"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "fix mobile skip to portals transition"
            git push origin HEAD:main
          fi
