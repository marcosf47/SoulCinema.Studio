name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RC402 mobile theater lifecycle reset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          h=p.read_text(encoding='utf-8')
          marker='<!-- RC402 MOBILE THEATER LIFECYCLE RESET -->'
          patch=marker+'''\n<script id="rc402-mobile-theater-lifecycle-reset">\n(()=>{\n const mobile=()=>matchMedia('(max-width:860px)').matches||matchMedia('(pointer:coarse)').matches;\n const theater=()=>document.getElementById('screeningTheater');\n const lobby=()=>document.getElementById('lobby');\n const player=()=>document.getElementById('theaterPlayer');\n let wasTheater=false;\n const cleanPlayer=()=>{const v=player();if(!v)return;try{v.pause()}catch(_){};try{v.currentTime=0}catch(_){};v.removeAttribute('data-transitioning');v.style.pointerEvents='';v.style.opacity='';};\n const revivePlayer=()=>{const v=player();if(!v)return;v.style.pointerEvents='auto';v.removeAttribute('inert');try{v.load()}catch(_){};requestAnimationFrame(()=>{try{const p=v.play();p?.catch?.(()=>{})}catch(_){}})};\n const reviveLobby=()=>{if(!lobby()?.classList.contains('active'))return;const p=document.getElementById('portals');if(p){p.style.pointerEvents='auto';p.removeAttribute('inert');p.setAttribute('aria-hidden','false');[...p.querySelectorAll('.portal,button,[role="button"]')].forEach(el=>{el.style.pointerEvents='auto';el.removeAttribute('inert')})}document.body.style.pointerEvents='';document.documentElement.style.pointerEvents='';};\n const sync=()=>{if(!mobile())return;const now=theater()?.classList.contains('active');if(now&&!wasTheater){wasTheater=true;requestAnimationFrame(()=>requestAnimationFrame(revivePlayer));setTimeout(revivePlayer,120)}else if(!now&&wasTheater){wasTheater=false;cleanPlayer();requestAnimationFrame(()=>requestAnimationFrame(reviveLobby));setTimeout(reviveLobby,100);setTimeout(reviveLobby,280)}};\n new MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class','style','aria-hidden','inert']});\n window.addEventListener('pageshow',sync);sync();\n})();\n</script>\n'''
          if marker not in h:
              if '</body>' not in h: raise SystemExit('Missing body anchor')
              p.write_text(h.replace('</body>',patch+'</body>',1),encoding='utf-8')
          PY
      - name: Verify RC402 patch
        run: |
          grep -q 'rc402-mobile-theater-lifecycle-reset' public/index.html
          grep -q 'rc401-mobile-portal-return-stabilization' public/index.html
          grep -q 'rc342-mobile-navigation-owner' public/index.html
      - name: Commit RC402 source
        run: |
          git config user.name 'SoulCinema Direct Deploy'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/index.html; then echo 'RC402 already applied'; else git add public/index.html && git commit -m 'RC402 reset mobile theater lifecycle and player' && git push origin HEAD:main; fi
