name: SoulCinema Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC310 desktop Live Center hard size cap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- RC310 DESKTOP LIVE CENTER HARD SIZE CAP -->'
          anchor='<!-- RC309 DESKTOP LIVE CENTER MASTER OVERSIZE FIX -->'
          patch='''<!-- RC310 DESKTOP LIVE CENTER HARD SIZE CAP -->
<style id="rc310-desktop-live-hard-size-cap">
@media (min-width:861px){
  #liveCenter.active #livePlayerWrap{
    position:absolute!important;
    top:170px!important;
    left:54px!important;
    right:auto!important;
    bottom:auto!important;
    width:min(70vw,1040px)!important;
    height:min(58vh,585px)!important;
    aspect-ratio:16/9!important;
    max-width:1040px!important;
    max-height:585px!important;
    min-width:0!important;
    min-height:0!important;
    margin:0!important;
    overflow:hidden!important;
    box-sizing:border-box!important;
  }
  #liveCenter.active #rc275LiveFrame{
    position:absolute!important;
    inset:0!important;
    width:100%!important;
    height:100%!important;
    max-width:100%!important;
    max-height:100%!important;
    border:0!important;
  }
  #liveCenter.active #rc307LiveInfo{
    top:170px!important;
    right:54px!important;
    bottom:auto!important;
    width:250px!important;
    height:min(58vh,585px)!important;
    min-height:0!important;
    max-height:585px!important;
    overflow:hidden!important;
  }
  #liveCenter.active #rc298LiveFullscreen{
    top:14px!important;
    right:14px!important;
    z-index:140!important;
  }
  #livePlayerWrap:fullscreen,#livePlayerWrap:-webkit-full-screen{
    position:fixed!important;
    inset:0!important;
    width:100vw!important;
    height:100vh!important;
    max-width:100vw!important;
    max-height:100vh!important;
    margin:0!important;
    border:0!important;
    border-radius:0!important;
    background:#000!important;
  }
}
</style>
'''
          if marker not in html:
              if html.count(anchor)!=1:
                  raise SystemExit('RC309 anchor mismatch; refusing to guess')
              html=html.replace(anchor,patch+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC310 and preserve locks
        run: |
          grep -q 'RC310 DESKTOP LIVE CENTER HARD SIZE CAP' public/index.html
          grep -q 'RC309 DESKTOP LIVE CENTER MASTER OVERSIZE FIX' public/index.html
          grep -q 'RC308 DESKTOP LIVE CENTER 16X9 FIT + FULLSCREEN POLISH' public/index.html
          grep -q 'RC307 DESKTOP LIVE CENTER LUXURY COMPOSITION' public/index.html
          grep -q 'RC305 DESKTOP LIVE CENTER IFRAME STATE AUTHORITY' public/index.html
          grep -q 'RC297 DESKTOP PRODUCTION ROOM VIEWPORT FIT' public/index.html
          grep -q 'RC293 MOBILE SKIP IMMEDIATE PORTAL OWNER' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Commit RC310 source
        run: |
          git config user.name "SoulCinema Direct Deploy"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "RC310 already applied"
          else
            git add public/index.html
            git commit -m "RC310 desktop Live Center hard size cap"
            git push origin HEAD:main
          fi
