name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC265 mobile skip coordinate + sequence lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='RC265 MASTER MOBILE SKIP COORDINATE + SEQUENCE LOCK'
          if marker not in html:
              old="function sequence(preserveLobbyPlayback=false){clearTimers();"
              if html.count(old)!=1:
                  raise SystemExit(f'Expected exactly one sequence() prefix, found {html.count(old)}; refusing to guess')
              new="function sequence(preserveLobbyPlayback=false){if(matchMedia('(max-width:700px)').matches&&lobby.classList.contains('portal-mode'))return;clearTimers();"
              html=html.replace(old,new,1)

              rc264=" // RC264 MASTER ENGINE MOBILE SKIP FIX"
              if html.count(rc264)!=1:
                  raise SystemExit(f'Expected exactly one RC264 showPortals marker, found {html.count(rc264)}; refusing to guess')
              html=html.replace(rc264,rc264+"\n // RC265 MASTER MOBILE SKIP COORDINATE + SEQUENCE LOCK",1)

              patch=base64.b64decode('').decode('utf-8')
              anchor='</body>'
              if html.count(anchor)!=1:
                  raise SystemExit('Expected one </body>; refusing to guess')
              html=html.replace(anchor,patch+'\n'+anchor,1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Verify RC265
        run: |
          grep -q 'RC265 MASTER MOBILE SKIP COORDINATE + SEQUENCE LOCK' public/index.html
          grep -q 'rc265-mobile-skip-coordinate-owner' public/index.html
          grep -q 'rc265-mobile-skip-coordinate-lock' public/index.html
          grep -q "lobby.classList.contains('portal-mode'))return;clearTimers()" public/index.html
          grep -q 'RC261 MASTER MOBILE THE GATE BACK FIX' public/index.html
          grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC265 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC265 already locked"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "RC265 master mobile skip coordinate and sequence lock"
            git push origin HEAD:main
          fi
