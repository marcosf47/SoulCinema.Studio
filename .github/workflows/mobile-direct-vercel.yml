name: SoulCinema Mobile Direct Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-direct-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply RC258 mobile theater restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          marker='rc258-mobile-screening-theater-restore'
          if marker not in html:
              patch=r'''
          <style id="rc258-mobile-screening-theater-restore">
          /* RC258 — MOBILE SCREENING THEATER CONTENT RESTORE.
             Mobile only. Desktop remains locked. Existing DOM/media/routing preserved. */
          @media(max-width:700px){
            #screeningTheater .collection-strip{
              display:grid!important;
              grid-template-columns:1fr!important;
              gap:10px!important;
              width:100%!important;
              padding:0!important;
              margin:0!important;
              visibility:visible!important;
              opacity:1!important;
            }
            #screeningTheater .collection-card{
              display:flex!important;
              width:100%!important;
              min-height:88px!important;
              padding:14px 16px!important;
              visibility:visible!important;
              opacity:1!important;
              pointer-events:auto!important;
              touch-action:manipulation!important;
            }
            #screeningTheater .collection-card small{
              font-size:9px!important;
              line-height:1.2!important;
            }
            #screeningTheater .collection-card strong{
              font-size:17px!important;
              line-height:1.18!important;
            }
            #screeningTheater #theaterPlay{
              display:grid!important;
              place-items:center!important;
              visibility:visible!important;
              opacity:1!important;
              pointer-events:auto!important;
              position:relative!important;
              z-index:30!important;
              width:64px!important;
              height:64px!important;
              min-width:64px!important;
              min-height:64px!important;
              margin:18px auto 0!important;
            }
            #screeningTheater .theater-poster-copy{overflow:visible!important;}
          }
          </style>
          '''
              if '</body></html>' not in html:
                  raise SystemExit('closing body/html marker missing')
              html=html.replace('</body></html>',patch+'\n</body></html>')
              p.write_text(html,encoding='utf-8')
          if marker not in p.read_text(encoding='utf-8'):
              raise SystemExit('RC258 marker missing after patch')
          PY

      - name: Verify RC258 mobile build
        run: grep -q 'rc258-mobile-screening-theater-restore' public/index.html

      - name: Lock RC258 into source
        run: |
          if git diff --quiet -- public/index.html; then
            echo "RC258 already locked in source"
          else
            git config user.name "SoulCinema Mobile Deploy"
            git config user.email "actions@users.noreply.github.com"
            git add public/index.html
            git commit -m "fix mobile screening theater content visibility"
            git push origin HEAD:main
          fi
