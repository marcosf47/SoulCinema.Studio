name: SoulCinema Live Surgical Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-surgical-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Mobile V2 Live only
        run: python3 scripts/live_surgical_once.py
      - name: Commit surgical patch and clean helpers
        run: |
          git config user.name "SoulCinema C.D."
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/live-surgical-once.yml scripts/live_surgical_once.py
          git add public/mobile-v2.html
          git commit -m "Mobile Live: restore OFF AIR gate and harden automatic 16:9 landscape"
          git push
