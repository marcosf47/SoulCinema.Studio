name: SoulCinema MASTER FINAL LIVE
on:
  push:
    branches:
      - ep-final-preview-20260904
    paths:
      - .github/workflows/final-polish.yml
permissions:
  contents: write
jobs:
  master-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ep-final-preview-20260904
      - name: Apply MASTER patch
        run: node patches/ep-final-surgical-polish.js
      - name: Commit MASTER patch
        run: |
          git config user.name "SoulCinema C.D."
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "MASTER FINAL LIVE: exact media and clean cut"
          git push origin HEAD:ep-final-preview-20260904
