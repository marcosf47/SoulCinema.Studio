name: SoulCinema App V1 Preview Verify
on:
  push:
    branches: [soulcinema-app-v1]
    paths:
      - "app/**"
      - "public/app/**"
      - "vercel.app-preview.json"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "public/app/**"
      - "vercel.app-preview.json"
      - ".github/workflows/app-v1-preview-verify.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolated App V1 package
        run: |
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "soulcinema-app-v1"
          test -f app/index.html
          test -f app/manifest.webmanifest
          test -f app/sw.js
          test -f app/PHASE1-CHECKPOINT.md
          test -f public/app/index.html
          test -f public/app/manifest.webmanifest
          test -f public/app/sw.js
          cmp -s app/index.html public/app/index.html
          cmp -s app/manifest.webmanifest public/app/manifest.webmanifest
          cmp -s app/sw.js public/app/sw.js
          grep -q 'soulcinema-app-lifecycle' app/index.html
          grep -q 'soulcinema-app-media-guard' app/index.html
          grep -q '/app/manifest.webmanifest' app/index.html
          grep -q '/app/sw.js' app/index.html
          grep -q 'soulcinema-app-shell-v3' app/sw.js
          grep -q 'start_url.*\/app\/index.html#gate' app/manifest.webmanifest
          grep -q 'scope.*\/app\/' app/manifest.webmanifest
          grep -q 'const LIVE_FEED=' app/index.html
          grep -q 'const SC_API=' app/index.html
          grep -q 'function hardStop' app/index.html
          grep -q 'function destroyLive' app/index.html
          grep -q 'function destroyDiscovery' app/index.html
          grep -q 'scFrame=null' app/index.html
          grep -q 'scFrame=f' app/index.html
          grep -q 'setVolume(0)' app/index.html
          grep -q 'seekTo(0)' app/index.html
          grep -q 'about:blank' app/index.html
          grep -q 'w.pause()' app/index.html
          grep -q 'w.seekTo(0)' app/index.html
          grep -q 'f.src="about:blank"' app/index.html
          grep -q 'visibilitychange' app/index.html
          grep -q 'pagehide' app/index.html
          grep -q 'beforeunload' app/index.html
          grep -q 'popstate' app/index.html
          grep -q 'freeze' app/index.html
          test "$(grep -o 'id="gate"' app/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="home"' app/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="theater"' app/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="music"' app/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="live"' app/index.html | wc -l)" -eq 1
          ! grep -q 'public/mobile-v2.html' vercel.app-preview.json
          python - <<'PY'
import re
from pathlib import Path
s=Path("app/index.html").read_text()
ids=re.findall(r'\bid="([^"]+)"',s)
targets=re.findall(r'data-go="([^"]+)"',s)
missing=sorted(set(targets)-set(ids))
dupes=sorted({x for x in ids if ids.count(x)>1})
assert not missing, f"Missing route destinations: {missing}"
assert not dupes, f"Duplicate IDs: {dupes}"
assert len(targets)==68, f"Unexpected route target count: {len(targets)}"
print(f"Route graph OK: {len(targets)} targets, 0 missing, 0 duplicate IDs")
PY
      - name: Production isolation gate
        run: |
          git diff --exit-code origin/main -- public/mobile-v2.html public/index.html
